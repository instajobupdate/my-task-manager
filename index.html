/* ============================== LOGIN GATE ==============================
   Beat Ledger is single-user (Kapil only). Supabase Auth handles sign-in, and the
   database's Row Level Security policy only lets kapilchoudhari73@gmail.com read/write —
   so even if someone else finds the link and signs up with a different email, they just
   see an app stuck on "Loading..." forever, no real data ever loads for them.
   First-ever run: click "Create account" with your Gmail + a password you choose —
   Supabase emails a confirmation link to that Gmail; click it once, then log in normally. */
function startAuthGate(){
  // A password-reset email link lands back here with "#...&type=recovery" in the URL — Supabase's
  // client auto-detects that hash and fires a PASSWORD_RECOVERY event below rather than SIGNED_IN,
  // but that event can arrive slightly after getSession() resolves, so this flag stops the normal
  // getSession()-based auto-login from racing ahead and loading the app before the reset form shows.
  var isRecovery = /type=recovery/.test(window.location.hash);
  if(isRecovery){
    renderLoginScreen('reset');
  } else {
    supa.auth.getSession().then(function(res){
      var session = res.data && res.data.session;
      if(session){ startAppWithSession(); } else { renderLoginScreen(); }
    });
  }
  supa.auth.onAuthStateChange(function(event, session){
    if(event==='PASSWORD_RECOVERY'){ renderLoginScreen('reset'); return; }
    if(event==='SIGNED_IN' && session && !isRecovery){ startAppWithSession(); }
    if(event==='SIGNED_OUT'){ location.reload(); }
  });
}

var _appStarted = false;
function startAppWithSession(){
  if(_appStarted) return;
  _appStarted = true;
  checkAccessAndStart();
}
// Access-control gate (added 2026-09-23, Kapil's SaaS-roadmap decision): a signed-in user only
// gets the app once their public.user_profiles row has status='approved' -- set manually by an
// admin (is_admin=true) from the new Admin tab below. A brand-new signup sits at 'pending' until
// Kapil approves it; 'rejected' shows a plain "no access" screen. This runs every time a session
// starts (not just on first signup) so a status change made while the user is logged out/pending
// takes effect on their next load, and realtime-unlocks it below while they're sitting on the
// pending screen.
function checkAccessAndStart(){
  supa.auth.getUser().then(function(res){
    var user = res.data && res.data.user;
    if(!user){ location.reload(); return; }
    state.currentUser = {id:user.id, email:user.email};
    watchOwnProfile(user.id); // live-watch our own status for as long as this tab is open, in
    // BOTH directions: unlocks a pending screen the moment Kapil approves, and just as
    // importantly, kicks an already-logged-in user straight to the gate screen the moment Kapil
    // revokes them from the Admin tab (Reject works on an already-approved user too, not just a
    // pending one) -- without this, a revoked user's session would keep showing the app and only
    // start throwing "permission denied" toasts on the next read/write, which is safe (RLS blocks
    // it either way) but confusing.
    supa.from('user_profiles').select('status,is_admin').eq('id', user.id).maybeSingle().then(function(pres){
      if(pres.error){ toast(dbErrMsg(pres.error, 'Access check failed'), true); return; }
      var profile = pres.data;
      if(!profile){
        // No profile row yet -- e.g. the signup DB trigger hasn't run/existed when this account
        // was created. Create one now as 'pending' (safe default, never auto-grants access) and
        // re-check rather than assuming approved.
        supa.from('user_profiles').upsert({id:user.id, email:user.email, status:'pending', is_admin:false}, {onConflict:'id'}).then(function(){
          sendUserEmail({type:'signup', newUserEmail:user.email});
          checkAccessAndStart();
        });
        return;
      }
      state.isAdmin = !!profile.is_admin;
      if(profile.status==='approved'){ launchApp(); }
      else { renderAccessGateScreen(profile.status); }
    });
  });
}
var _ownProfileWatchSet = false;
function watchOwnProfile(userId){
  if(_ownProfileWatchSet) return; // one subscription per page load is enough, whether we're on the gate screen or already inside the app
  _ownProfileWatchSet = true;
  supa.channel('profileWatch:'+userId)
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'user_profiles', filter:'id=eq.'+userId}, function(){
      // Something about our own status changed (approved, rejected, or re-approved) -- simplest
      // correct reaction is a full reload, which re-runs checkAccessAndStart() and lands on
      // whichever screen (app vs. gate) the new status actually allows.
      location.reload();
    })
    .subscribe();
}

// One icon+label+input field. `withToggle` adds the show/hide-password eye button (wired below).

    '<div class="inputIcon'+(withToggle?' hasToggle':'')+'"><span class="iconChip">'+iconSvg+'</span>'+inputHtml+

// Show/hide toggle for every password field on the current screen (Enter Password, Confirm, etc.)
// -- toggles that field's input type and swaps the eye/eye-off icon; doesn't submit the form.
function wireAuthPasswordToggles(root){
  qsa('[data-pwtoggle]', root).forEach(function(btn){
    btn.addEventListener('click', function(){
      var input = btn.closest('.inputIcon').querySelector('input');
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.innerHTML = showing ? AUTH_ICON_EYE : AUTH_ICON_EYE_OFF;
    });
  });
}

          // Drop the "#...&type=recovery" hash so a refresh doesn't re-trigger the reset screen,
          // then load the app with the session the recovery link already signed in.
          history.replaceState(null, '', window.location.pathname + window.location.search);
          setTimeout(function(){ startAppWithSession(); }, 700);
        }).catch(function(e){ msg.style.color = 'var(--critical)'; msg.textContent = (e&&e.message)||'Something went wrong.'; submitBtn.disabled = false; });

    if(mode==='forgot'){

        '<div class="authCard">'+
          '<div class="authWordmark"><span class="line1">BEAT</span><span class="line2">LEDGER</span><span class="rule"></span></div>'+
          '<div class="display authTitle">Forgot password?</div>'+

          '</form>'+
        '</div>';
      qs('#forgotBackBtn').addEventListener('click', function(){ mode = 'signin'; paint(); });
      qs('#forgotForm').addEventListener('submit', function(e){
        e.preventDefault();
        var email = qs('#forgotEmail').value.trim();
        var msg = qs('#forgotMsg');
        var submitBtn = qs('#forgotSubmitBtn');
        submitBtn.disabled = true; msg.style.color = 'var(--ink-soft)'; msg.textContent = 'Sending...';
        supa.auth.resetPasswordForEmail(email, {redirectTo: window.location.origin + window.location.pathname}).then(function(res){
          if(res.error){ msg.style.color = 'var(--critical)'; msg.textContent = res.error.message; submitBtn.disabled = false; return; }
          msg.style.color = 'var(--good)'; msg.textContent = 'Reset link sent — check your Gmail inbox and click it to set a new password.';
        }).catch(function(e){ msg.style.color = 'var(--critical)'; msg.textContent = (e&&e.message)||'Something went wrong.'; submitBtn.disabled = false; });
      });
      return;
    }

    root.innerHTML =
      authBgIconsHtml()+
      '<div class="authCard">'+
        '<div class="authWordmark"><span class="line1">BEAT</span><span class="line2">LEDGER</span><span class="rule"></span></div>'+
        '<div class="authSubtitle" style="margin-top:2px">'+(mode==='signin' ? 'Welcome back — sign in to continue.' : 'Create your account to get started.')+'</div>'+
        '<form id="authForm" class="authBox">'+
          authField(AUTH_ICON_MAIL, 'Email', 'authEmail', '<input type="email" id="authEmail" required>', false)+
          authField(AUTH_ICON_LOCK, 'Password', 'authPassword', '<input type="password" id="authPassword" minlength="6" required>', true)+
          '<button type="submit" class="btn btn-primary" id="authSubmitBtn">'+(mode==='signin'?'Login':'Create account')+' <span aria-hidden="true">&rarr;</span></button>'+
          '<button type="button" class="authFootLink" id="authSwitchBtn">'+(mode==='signin'?'Create a new account':'Already have an account? Login')+'</button>'+
          (mode==='signin' ? '<button type="button" class="authFootLink" id="authForgotBtn">Forgot password?</button>' : '')+
          '<div id="authMsg" style="min-height:34px;font-size:13px;color:var(--ink-soft);text-align:center"></div>'+
        '</form>'+
      '</div>';
    wireAuthPasswordToggles(root);
    qs('#authSwitchBtn').addEventListener('click', function(){ mode = mode==='signin'?'signup':'signin'; paint(); });
    if(mode==='signin'){ qs('#authForgotBtn').addEventListener('click', function(){ mode = 'forgot'; paint(); }); }
    qs('#authForm').addEventListener('submit', function(e){
      e.preventDefault();
      var email = qs('#authEmail').value.trim();
      var password = qs('#authPassword').value;
      var msg = qs('#authMsg');
      var submitBtn = qs('#authSubmitBtn');
      submitBtn.disabled = true; msg.style.color = 'var(--ink-soft)'; msg.textContent = 'One moment...';
      var action = mode==='signin'
        ? supa.auth.signInWithPassword({email:email, password:password})
        : supa.auth.signUp({email:email, password:password});
      action.then(function(res){
        if(res.error){ msg.style.color = 'var(--critical)'; msg.textContent = res.error.message; submitBtn.disabled = false; return; }
        if(mode==='signup' && !(res.data && res.data.session)){
          msg.style.color = 'var(--good)';
          msg.textContent = 'Confirmation email sent — check your Gmail inbox, click the link, then log in here.';
          submitBtn.disabled = false; mode = 'signin'; return;
        }
        // signed in (or sign-up returned a session directly) — onAuthStateChange fires startAppWithSession()
      }).catch(function(e){ msg.style.color = 'var(--critical)'; msg.textContent = (e&&e.message)||'Something went wrong.'; submitBtn.disabled = false; });
    });
  }
  paint();
}

// Header notification bell (admins only) -- shows a red badge with the count of signups
// waiting for approval, click jumps to the Admin tab. Added 2026-09-23 per Kapil's request so
// "something needs my attention" is visible from any tab, not just when he happens to open Admin.
// 2026-09-24: also plays a short beep (Web Audio API -- no sound file to host/download) whenever
// the pending count goes UP while the app is open, i.e. a genuinely new signup just arrived --
// never on page load just because some already-pending users exist (see _notifBellInited below),
// and never just because an admin approved/rejected someone (that only ever holds count steady or
// lowers it). Most mobile/desktop browsers block audio until the user has interacted with the
// page at least once, so a one-time click listener below "unlocks" the AudioContext early.
var _audioCtx = null;
function ensureAudioCtx(){
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(_audioCtx.state === 'suspended') _audioCtx.resume();
  }catch(e){}
  return _audioCtx;
}
document.addEventListener('click', function unlockAudioOnce(){
  ensureAudioCtx();
  document.removeEventListener('click', unlockAudioOnce);
}, {once:true});
function playNotifSound(){
  var ctx = ensureAudioCtx();
  if(!ctx) return;
  try{
    var now = ctx.currentTime;
    [{freq:880, start:0, dur:0.12}, {freq:1175, start:0.14, dur:0.18}].forEach(function(note){
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = note.freq;
      gain.gain.setValueAtTime(0, now+note.start);
      gain.gain.linearRampToValueAtTime(0.22, now+note.start+0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now+note.start+note.dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now+note.start);
      osc.stop(now+note.start+note.dur+0.02);
    });
  }catch(e){}
}
function wireNotifBell(){
  var btn = qs('#notifBell');
  if(!btn) return;
  btn.style.display = state.isAdmin ? 'inline-flex' : 'none';
  if(btn.__wired) return;
  btn.__wired = true;

}
var _notifBellInited = false, _lastPendingCount = 0;
function updateNotifBell(){
  if(!state.isAdmin) return;
  var btn = qs('#notifBell'), badge = qs('#notifBellBadge');
  if(!btn || !badge) return;
  var pendingCount = (state.allUsers||[]).filter(function(u){ return u.status==='pending'; }).length;
  if(_notifBellInited && pendingCount > _lastPendingCount) playNotifSound();
  _lastPendingCount = pendingCount;
  _notifBellInited = true;
  badge.textContent = pendingCount>9 ? '9+' : String(pendingCount);
  badge.style.display = pendingCount>0 ? 'flex' : 'none';
  btn.title = pendingCount>0 ? (pendingCount+' signup(s) waiting for approval') : 'No pending approvals';
}

/* ============================== ADMIN — USER APPROVAL (admin-only tab) ==============================
   public.user_profiles is a real Postgres table (not one of the generic `documents` collections),
   so this talks to Supabase directly via supa.from(...) rather than through the db/makeDb() wrapper.
   Only reachable by state.isAdmin===true accounts -- also enforced server-side by that table's RLS. */
// Fire-and-forget call to the 'handle-user-email' Edge Function (Resend-based transactional
// emails: admin(s) get notified on signup, the user gets a welcome email on approval or the typed
// reason on rejection). Never blocks the UI and never surfaces an error toast -- the approve/
// reject/signup action itself must still succeed even if the email fails to send (e.g. before
// Kapil has added the RESEND_API_KEY secret in Supabase); email is layered on top, not a dependency.
function sendUserEmail(payload){
  try{ supa.functions.invoke('handle-user-email', {body:payload}).catch(function(){}); }catch(e){}
}
function fetchAdminUsers(){
  supa.from('user_profiles').select('id,email,status,is_admin,created_at,reject_reason').order('created_at', {ascending:false}).then(function(res){
    if(res.error){ toast(dbErrMsg(res.error, "Couldn't load users"), true); return; }
    state.allUsers = res.data || [];
    updateNotifBell();
    if(state.tab==='admin') render();
  });
}
function subscribeAdminUsers(){
  fetchAdminUsers();
  supa.channel('admin:user_profiles')
    .on('postgres_changes', {event:'*', schema:'public', table:'user_profiles'}, fetchAdminUsers)
    .subscribe();
}
function renderAdmin(c, extra){
  extra.innerHTML = '';

    var when = (u.created_at||'').slice(0,10);

    if(u.status!=='approved') actions += '<button class="btn btn-sm btn-primary approveUserBtn" data-id="'+esc(u.id)+'" data-email="'+esc(u.email)+'">Approve</button> ';
    if(u.status!=='rejected' && !u.is_admin) actions += '<button class="btn btn-sm btn-danger rejectUserBtn" data-id="'+esc(u.id)+'" data-email="'+esc(u.email)+'">Reject</button>';

      '<td style="font-weight:600">'+esc(u.email)+(u.is_admin?' <span class="pill">Admin</span>':'')+'</td>'+

      '<td>'+actions+'</td>'+
    '</tr>';
  }).join('');
  c.innerHTML =
    '<div class="card">'+
      '<div class="row" style="justify-content:space-between;align-items:center">'+
        '<h3 style="margin:0">Users'+(pendingCount>0?' <span class="pill"><span class="dot dot-warning"></span>'+pendingCount+' waiting for approval</span>':'')+'</h3>'+
      '</div>'+
      '<div class="statSub" style="margin-top:4px">A new signup will show up here. Until you approve them, they can\'t add any data. An approved user can be rejected later too, which removes their access right away. The user gets an email either way, approve or reject.</div>'+
    '</div>'+
    '<div class="tableWrap"><table><thead><tr><th>Email</th><th>Signed up</th><th>Status</th><th></th></tr></thead><tbody>'+
      (rows || '<tr><td colspan="4" style="text-align:center;opacity:.6">No signups yet</td></tr>')+
    '</tbody></table></div>';
  qsa('.approveUserBtn', c).forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-id'), email = b.getAttribute('data-email');
      b.disabled = true;
      supa.from('user_profiles').update({status:'approved'}).eq('id', id).then(function(res){

        sendUserEmail({type:'approved', targetEmail:email});
      });
    });
  });
  qsa('.rejectUserBtn', c).forEach(function(b){
    b.addEventListener('click', function(){

  // Admin tab is pushed in) -- #hamburgerBtn/#backdrop/#sideCloseBtn are fixed elements in the

/* Light/Dark toggle — stored per-device in localStorage (never in db, since this is just a
   per-viewer display preference, not shared data). Defaults to LIGHT regardless of the
   phone/browser's own dark-mode setting (see the inline <script> right after the main
   <style> block, which applies this before first paint too). */
function currentTheme(){ return document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light'; }
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('blTheme', t); }catch(e){}
  updateThemeToggleBtn();
}
function updateThemeToggleBtn(){
  var btn = qs('#themeToggleBtn');
  if(!btn) return;
  btn.innerHTML = currentTheme()==='dark' ? '&#9728;&#65039; Light mode' : '&#127769; Dark mode';
}
function wireThemeToggle(){
  updateThemeToggleBtn();
  var btn = qs('#themeToggleBtn');
  if(btn.__wired) return; // renderShellStatic can run again (e.g. after reconnect) — don't double-bind
  btn.__wired = true;
  btn.addEventListener('click', function(){ setTheme(currentTheme()==='dark' ? 'light' : 'dark'); });
}
var _navFromPopstate = false; // set right before goToTab() when called from the popstate handler, so it doesn't push a duplicate history entry for a navigation the browser already did
function goToTab(tabId){
  // Guard against a stale tabId -- e.g. a browser Back/Forward history entry left over from before
  // a tab was removed (Order Recommendation/PDC Cheques merged/removed 2026-09-25). Without this,
  // TABS.find(...) below would return undefined and .label would throw, breaking navigation.
  if(!TABS.some(function(t){ return t.id===tabId; })) tabId = 'dashboard';
  state.tab = tabId;
  qsa('#navlist button').forEach(function(x){ x.classList.toggle('active', x.getAttribute('data-tab')===tabId); });
  qs('#pageTitle').textContent = TABS.find(function(t){return t.id===tabId;}).label;
  closeSidebarMobile();
  render();
  if(!_navFromPopstate){
    try{ history.pushState({tab:tabId}, '', location.href); }catch(e){}
  }
  _navFromPopstate = false;
}
// ============================== BACK BUTTON HANDLING ==============================
// Kapil's report: pressing the phone/browser Back button while on any tab other than
// Dashboard closed the WHOLE app instead of just going back a step -- because goToTab() never
// recorded any browser history, so the very first Back press had nothing of ours to consume and
// fell straight through to leaving the page. Fix: every tab switch now pushes a history entry
// (above), and opening a modal pushes one too; Back first closes an open modal, then walks back
// through previously-visited tabs, and only actually leaves the app once that trail runs out --
// matching how Kapil expects an app's Back button to behave.
function setupBackButtonHandling(){
  try{ history.replaceState({tab:state.tab}, '', location.href); }catch(e){}
  window.addEventListener('popstate', function(e){
    if(qs('#modalRoot').innerHTML.trim()){
      // A modal was open when Back was pressed -- the browser just consumed the history entry
      // openModal() pushed for it, so just dismiss it here; no tab change, nothing to re-push.
      qs('#modalRoot').innerHTML='';
      _modalHistoryPushed = false;
      return;
    }
    var tabId = (e.state && e.state.tab) || 'dashboard';
    _navFromPopstate = true;
    goToTab(tabId);
  });
}

// render() always rebuilds the whole tab's innerHTML from scratch, which normally means a text
// input mid-typing loses focus and cursor position on every re-render (e.g. a debounced live
// search box -- had to click back into the box after every letter). Use this instead of a bare
// render() from any input/search handler that re-renders on every keystroke: it remembers which
// field had focus (by id, since ids are unique and stable across a re-render) and its cursor
// position, re-renders, then restores both.
function renderKeepFocus(){
  var active = document.activeElement;
  var id = (active && (active.tagName==='INPUT'||active.tagName==='TEXTAREA') && active.id) ? active.id : null;
  var selStart = (id && typeof active.selectionStart==='number') ? active.selectionStart : null;
  var selEnd = (id && typeof active.selectionEnd==='number') ? active.selectionEnd : null;
  render();
  if(id){
    var el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

  };

/* ============================== ORDER RECOMMENDATION ENGINE ==============================
   Driven by weekly stockist PDF reports (product/current-stock/recent-sale/last-month-sale),
   parsed by Claude in chat and written into the `weeklyReports` collection — see the
   "Order Recommendation" tab and the project doc for the parsing procedure.
   Formula considers: current stock, recent sales velocity (blended with last month's
   sale for stability), days-of-stock-remaining, fast/medium/slow/dead movement class,
   trend vs earlier weeks, near-expiry / scheme flags, safety stock + target cover days,
   and flags likely scheme/bonus/gift line items so they don't pollute the order list. */
function parseDMY(s){ // "DD/MM/YY" -> "YYYY-MM-DD"
  if(!s) return null;
  var p = s.split('/'); if(p.length!==3) return null;
  var yy = +p[2]; var yyyy = yy<70 ? 2000+yy : 1900+yy;
  return yyyy+'-'+p[1]+'-'+p[0];
}
function daysBetween(a, b){ // ISO date strings
  if(!a || !b) return null;
  var da = new Date(a+'T00:00:00'), db_ = new Date(b+'T00:00:00');
  return Math.round((db_-da)/86400000);
}
function avg(arr){ return arr.length ? arr.reduce(function(s,v){return s+v;},0)/arr.length : 0; }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
// Next occurrence (this year, or next year if it already passed) of a stored "YYYY-MM-DD"
// birthday, as an ISO date string -- the stored year is only ever used to pick the month/day,
// never compared against, since a birthday recurs every year. A 29 Feb birthday in a non-leap
// target year rolls forward to 1 Mar (native JS Date overflow behaviour) -- an acceptable
// once-every-4-years edge case rather than extra special-casing.
function nextBirthdayOccurrence(birthdayISO, todayIso){
  if(!birthdayISO) return null;
  var bd = ymdParts(birthdayISO);
  var t = ymdParts(todayIso||todayISO());
  var occYear = t.y;
  var occ = new Date(occYear, bd.m-1, bd.d);
  var today = new Date(t.y, t.m-1, t.d);
  if(occ < today){ occ = new Date(occYear+1, bd.m-1, bd.d); }
  return occ.getFullYear()+'-'+pad2(occ.getMonth()+1)+'-'+pad2(occ.getDate());
}
function ymdParts(iso){ var p=iso.split('-'); return {y:+p[0], m:+p[1], d:+p[2]}; }
function isLikelyScheme(product){ return /^(FREE\s|GIFT\s|ZZ\s|ON\s+\d|\d+\s*\+\s*\d+)/i.test(product||''); }

function weeklyReportsForStockist(stockistId){
  return Object.keys(state.weeklyReports)
    .map(function(k){ return state.weeklyReports[k]; })
    .filter(function(r){ return r.stockistId===stockistId; })
    .sort(function(a,b){ return (a.reportDate||'').localeCompare(b.reportDate||''); });
}

// ============================== ORDER RECOMMENDATION FORMULA (2026-09-20 rewrite, 2026-09-20 pending-qty removed) ==============================
// Required Formula (as specified by Kapil):
//   Daily Sales        = Sales ÷ Sales Period Days
//   Required Stock     = Daily Sales × (Order Cycle Days + Safety Days)
//   Suggested Order    = MAX(0, Required Stock − Closing Stock), then rounded UP to the MOQ multiple.
// (Pending/incoming quantity was in an earlier version of this formula — Kapil asked to drop it
// entirely, both from the calculation and from the table, since it wasn't a number he uses/trusts.
// Only PDF stock + sales drive the suggestion now.)
// Default Settings: Order Cycle Days = 15, Safety Days = 5 (Total Coverage = 20 days), MOQ = 10 pieces.
// "Sales" and "Sales Period Days" are always the MOST RECENT reporting period only (report-to-report gap,
// or month-start-to-report-date for the first report of a month) — never a blended/weighted average across
// several periods, and never a hardcoded 30-day assumption (see the `periods` derivation below, which uses
// each report's own actual date gap). This replaces the previous blended-velocity formula entirely.
function computeRecommendation(stockistId, overrideTotalDays){
  var reports = weeklyReportsForStockist(stockistId);
  if(reports.length===0) return {rows:[], asOf:null, historyCount:0};
  var latest = reports[reports.length-1];
  var orderCycleDays = state.settings.targetCoverDays || 15; // "targetCoverDays" is the stored field name for Order Cycle Days
  var safetyDays = state.settings.safetyDays || 5;
  var moqUnits = state.settings.moqUnits || 10;
  // Kapil can override the total "kitne din ka stock bulana hai" cover directly from the
  // Order Recommendation tab (per stockist, per view) instead of only via Settings — when
  // given, it replaces (orderCycleDays+safetyDays) as a single total-days number. Formula stays
  // identical either way — only how (Order Cycle Days + Safety Days) is arrived at changes.
  if(overrideTotalDays!=null && overrideTotalDays>0){
    orderCycleDays = overrideTotalDays;
    safetyDays = 0;
  }

  var byProduct = {};
  reports.forEach(function(rep){
    (rep.rows||[]).forEach(function(row){
      if(!byProduct[row.product]) byProduct[row.product]=[];
      byProduct[row.product].push(Object.assign({reportDate:rep.reportDate, month:rep.month}, row));
    });
  });

  var out = [];
  Object.keys(byProduct).forEach(function(product){
    var hist = byProduct[product].slice().sort(function(a,b){ return a.reportDate.localeCompare(b.reportDate); });
    var last = hist[hist.length-1];
    if(last.reportDate !== latest.reportDate) return; // dropped from the latest report — skip

    // Each period = one reporting gap: days between this report and the previous one (same month),
    // or from that month's 1st to the report date if it's the first report of the month. `qty` is the
    // actual sale quantity in that gap. We keep the FULL history here (used for the `trend` label and
    // for movement classification elsewhere) but the formula itself only uses the LAST period.
    var periods = [];
    for(var i=0;i<hist.length;i++){
      var cur = hist[i], prev = i>0 ? hist[i-1] : null;
      var d, qty;
      if(prev && prev.month===cur.month){ d=daysBetween(prev.reportDate, cur.reportDate); qty=cur.sale-prev.sale; }
      else { d=daysBetween(cur.month+'-01', cur.reportDate); qty=cur.sale; }
      if(d>0) periods.push({velocity: Math.max(0,qty)/d, days:d, qty:qty});
    }

    var trend = 'new';
    if(periods.length>=2){
      var latestV = periods[periods.length-1].velocity;
      var priorV = avg(periods.slice(0,-1).map(function(p){return p.velocity;}));
      if(priorV<=0.0001) trend = latestV>0.0001 ? 'up' : 'flat';
      else { var ch=(latestV-priorV)/priorV; trend = ch>0.15?'up':ch<-0.15?'down':'flat'; }
    }

    // ---- Required Formula ----
    var lastPeriod = periods.length ? periods[periods.length-1] : null;
    var salesPeriodDays = lastPeriod ? lastPeriod.days : null;     // actual report-period days, never hardcoded 30
    var sales = lastPeriod ? Math.max(0, lastPeriod.qty) : 0;      // Sales for that same period
    var dailySales = (salesPeriodDays && salesPeriodDays>0) ? sales/salesPeriodDays : 0; // Daily Sales = Sales ÷ Sales Period Days

    var closingStock = last.closeStock||0;
    var requiredStock = dailySales*(orderCycleDays+safetyDays);      // Required Stock = Daily Sales × (Order Cycle + Safety)

    var daysLeft = dailySales>0.0001 ? closingStock/dailySales : (closingStock>0 ? null : 0);
    var lastMoveISO = parseDMY(last.lastMoveDate);
    var daysSinceMove = lastMoveISO ? daysBetween(lastMoveISO, latest.reportDate) : null;
    var isDead = (daysSinceMove==null || daysSinceMove>60) && dailySales<=0.05;

    // ---- Sale regularity ----
    // "Regular" = product sells in most of the weekly reports on file, not just once in a while.
    // A PDF-marked scheme line ('#') or a name-pattern gift/scheme SKU almost always moves only when
    // a scheme is running — that's an occasional spike, not dependable repeat demand. Same idea for
    // any product that only shows a real sale in a minority of its observed periods. Kapil specifically
    // doesn't want these treated as top priority just because the latest number looks good.
    // NOTE: deliberately NOT keying this off the PDF's own "#" scheme marker (last.scheme) — that
    // marker turned out to be on almost every actively-selling product in a given report (a broad
    // "this SKU is on a company scheme right now" flag), so using it here would have deprioritized
    // nearly the whole catalog and left the priority list almost empty. Actual sale-history
    // consistency (below) is what genuinely separates "sells kabhi-kabhi" from "hamesha chalta hai".
    var salePeriodsCount = periods.filter(function(p){ return p.qty>0; }).length;
    var regularity = periods.length>0 ? salePeriodsCount/periods.length : null;
    var isSchemeFlagged = !!last.scheme || isLikelyScheme(product);
    var isIrregular = periods.length>=2 && regularity<0.5;

    var flags = [];
    var suggestedQty = 0;
    if(last.nearExpiry){ flags.push('Near Expiry'); }
    if(isLikelyScheme(product)){ flags.push('Scheme/gift line'); }
    if(last.scheme){ flags.push('Scheme'); }

    if(last.nearExpiry || isDead){
      // Near-expiry stock is never auto-included in a reorder (flagged instead, for a manual look);
      // same for dead stock (no real movement in 60+ days).
      suggestedQty = 0;
      if(isDead) flags.push('Dead stock');
    } else {
      var rawSuggested = Math.max(0, requiredStock - closingStock); // Suggested Order = MAX(0, Required Stock − Closing Stock)
      suggestedQty = rawSuggested;
      if(closingStock<=0 && dailySales>0.05){ flags.push('Zero stock'); }
      else if(dailySales>0.05 && closingStock > requiredStock*1.5){ flags.push('Overstock'); suggestedQty=0; }
    }

    // ---- Priority / urgency ranking ----
    // Per Kapil: stock ki QUANTITY se priority decide nahi karni — kitne din ka stock bacha hai
    // (current closing stock ÷ daily sale rate), usse karni hai. Jis product ka stock bhot kam ya
    // zero hai AUR uska sale acha chal raha hai (REGULARLY, occasionally nahi), use sabse pehle/top
    // priority milni chahiye. Jis product ka stock bahut zyada hai, use kam priority — neeche.
    // Scheme/occasional-sale products ko bhi neeche rakha jata hai chahe unka stock kitna bhi kam
    // ho, kyunki unka "acha sale" ek scheme ka burst hai, regular demand nahi. Near-expiry/dead
    // stock apni alag (lowest) bucket me rehte hain, kyunki wo already auto-reorder se excluded hain.
    var priority, priorityRank;
    if(last.nearExpiry || isDead){
      priority = 'none'; priorityRank = 5;               // not orderable right now — always last
    } else if(dailySales<=0.05){
      // No real sale velocity — low/zero stock alone does NOT earn priority here; Kapil's ask is
      // explicitly "kam stock AUR acchi sale" together, so a zero-stock/zero-sale line (e.g. an
      // unused gift/free SKU) must not jump to the top just because it has no stock.
      priority = 'low'; priorityRank = 3;
    } else if(isIrregular){
      priority = 'occasional'; priorityRank = 4;          // scheme-driven or sporadic sale — deprioritized regardless of stock
      flags.push(isSchemeFlagged ? 'Occasional sale (scheme)' : 'Occasional sale');
    } else if(closingStock<=0){
      priority = 'urgent'; priorityRank = 0;             // zero stock, regularly selling — top priority
    } else if(daysLeft!=null && daysLeft < orderCycleDays){
      priority = 'high'; priorityRank = 1;                // will run out before next order cycle itself
    } else if(daysLeft!=null && daysLeft < (orderCycleDays+safetyDays)*1.5){
      priority = 'medium'; priorityRank = 2;
    } else {
      priority = 'low'; priorityRank = 3;                 // lots of cover left despite decent sale
    }

    // MOQ rounding: round the final suggestion UP to the nearest multiple of the configured MOQ
    // (default 10) — e.g. 136 -> 140, 141 -> 150, 0 stays 0. Configurable via Settings, not hardcoded.
    if(suggestedQty > 0) suggestedQty = Math.ceil(suggestedQty/moqUnits)*moqUnits;

    out.push({
      product: product, currentStock: closingStock, closingStock: closingStock,
      periodSale: sales, sales: sales, salesPeriodDays: salesPeriodDays,
      pdfSale: last.sale||0, // raw "Sale" figure exactly as printed in the latest Stock Statement PDF (unlike `sales`, which is the period-diff the formula uses — this is for cross-checking against the physical statement)
      lastMonthSale: last.lastMonthSale||0,
      dailyVelocity: dailySales, dailySales: dailySales,
      requiredStock: requiredStock, orderCycleDays: orderCycleDays, safetyDays: safetyDays,
      daysLeft: daysLeft, trend: trend, suggestedQty: suggestedQty, regularity: regularity, isIrregular: isIrregular,
      priority: priority, priorityRank: priorityRank, flags: flags, lastMoveDate: last.lastMoveDate, isScheme: isLikelyScheme(product),
      isDead: isDead, nearExpiry: !!last.nearExpiry
    });
  });

  // "Fast/medium/slow moving" here means current stock quantity held (per Kapil: fast-moving =
  // jo product zyada stock me hai), NOT sale velocity — velocity still drives days-left/suggested
  // qty above, this classification is purely which products are carrying the most stock right now.
  // Dead/near-expiry stock keeps its own bucket regardless of quantity, since that's a distinct signal.
  var stockVals = out.filter(function(r){ return !r.isDead && !r.nearExpiry; }).map(function(r){return r.currentStock;}).sort(function(a,b){return a-b;});
  var sq1 = stockVals.length ? stockVals[Math.floor(stockVals.length/3)] : 0;
  var sq2 = stockVals.length ? stockVals[Math.floor(stockVals.length*2/3)] : 0;
  out.forEach(function(r){
    if(r.isDead || r.nearExpiry) r.movementClass = 'dead/none';
    else if(r.currentStock>=sq2) r.movementClass = 'fast';
    else if(r.currentStock>=sq1) r.movementClass = 'medium';
    else r.movementClass = 'slow';
  });

  // Manual "Add to Order List" overrides (Stock tab breakdown modal) — mark them here, once, so
  // every caller of computeRecommendation (renderOrders, orderBreakdownCard, alert counts, etc.)
  // sees the same r.manuallyAdded flag without recomputing it separately.
  var manualAdds = manualAddsFor(stockistId, latest.reportDate);
  out.forEach(function(r){ r.manuallyAdded = manualAdds.indexOf(r.product)>=0; });

  // Priority-based order, top to bottom — per Kapil's updated ask: jis product ka stock bhot kam
  // ya zero hai aur sale REGULARLY acha hai, wo sabse upar (urgent -> high -> medium -> low ->
  // occasional/scheme -> near-expiry/dead). Within the same priority bucket, fewer "days left"
  // (stock will run out sooner, relative to its own sale speed) sorts higher; a bigger suggested
  // order breaks any remaining tie. Movement class (fast/medium/slow — stock-qty based) still shows
  // as a label for context but no longer drives the ordering; raw current-stock quantity is
  // intentionally NOT the sort key any more.
  out.sort(function(a,b){
    if(a.priorityRank !== b.priorityRank) return a.priorityRank - b.priorityRank;
    var ad = a.daysLeft==null ? Infinity : a.daysLeft;
    var bd = b.daysLeft==null ? Infinity : b.daysLeft;
    if(ad !== bd) return ad - bd;
    return b.suggestedQty - a.suggestedQty;
  });

  return {rows: out, asOf: latest.reportDate, historyCount: reports.length};
}

function lowStockAlertCount(){
  var count = 0;
  allStockistIds().forEach(function(sid){
    var rec = computeRecommendation(sid);
    count += rec.rows.filter(function(r){ return (r.suggestedQty>0 && !r.isScheme) || r.manuallyAdded; }).length;
  });
  return count;
}

// Every product currently flagged `nearExpiry` (the stock statement PDF's trailing "*" marker,
// see parseStockStatementLine) across every stockist's latest weekly report -- feeds the
// Dashboard's "Needs Attention" alert and the Near Expiry modal below. Scheme/gift lines are
// excluded (nothing to "clear" -- they're not real orderable stock).
function nearExpiryProductsAcrossStockists(){
  var out = [];
  state.stockists.forEach(function(s){
    var rec = computeRecommendation(s.id);
    rec.rows.filter(function(r){ return r.nearExpiry && !r.isScheme; }).forEach(function(r){
      out.push({
        stockistId: s.id, stockistName: s.name, product: r.product,
        currentStock: r.currentStock, lastMoveDate: r.lastMoveDate, asOf: rec.asOf
      });
    });
  });
  out.sort(function(a,b){ return b.currentStock - a.currentStock; });
  return out;
}

/* ============================== SIMPLE SVG BAR CHART ============================== */
/* opts: {labels:[], series:[{name,color,values:[]}], goal (number|null), height, fmt(v) } */
function renderBarChart(container, opts){
  var W = container.clientWidth || 600;
  var H = opts.height || 220;
  var padL = 54, padR = 14, padT = 16, padB = 30;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  var labels = opts.labels, series = opts.series;
  var n = labels.length;
  var maxVal = 0;
  series.forEach(function(s){ s.values.forEach(function(v){ if(v>maxVal) maxVal=v; }); });
  if(!opts.goal && maxVal<=0){
    container.innerHTML = '<div class="empty" style="padding:24px">No data available for this period yet.</div>';
    return;
  }
  if(opts.goal && opts.goal>maxVal) maxVal = opts.goal;
  if(maxVal<=0) maxVal = 1;
  var niceMax = niceNumber(maxVal);
  var groupW = plotW/n;
  var barsPerGroup = series.length;
  var barGap = 3;
  var barW = Math.max(4, (groupW*0.62 - barGap*(barsPerGroup-1)) / barsPerGroup);

  function y(v){ return padT + plotH - (v/niceMax)*plotH; }

  var gridLines = 4;
  var gridSvg='';
  var ticksSvg='';
  for(var g=0; g<=gridLines; g++){
    var val = niceMax*g/gridLines;
    var yy = y(val);
    gridSvg += '<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1" />';
    ticksSvg += '<text x="'+(padL-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10.5" fill="var(--muted)">'+shortNum(val)+'</text>';
  }

  var barsSvg='';
  var labelsSvg='';
  for(var i=0;i<n;i++){
    var gx = padL + i*groupW + groupW*0.19;
    for(var s=0;s<series.length;s++){
      var v = series[s].values[i]||0;
      var bx = gx + s*(barW+barGap);
      var by = y(v);
      var bh = padT+plotH - by;
      barsSvg += '<rect class="barMark" data-i="'+i+'" data-s="'+s+'" x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(0,bh).toFixed(1)+'" rx="3" fill="'+series[s].color+'"></rect>';
    }
    labelsSvg += '<text x="'+(padL+i*groupW+groupW/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+esc(labels[i])+'</text>';
  }
  var goalSvg='';
  if(opts.goal){
    var gy = y(opts.goal);
    goalSvg = '<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5,4" />';
  }
  // Optional second flat line, drawn only from opts.goal2FromIndex onward -- used by the Dashboard
  // to show the RECALCULATED required monthly pace for the remaining months, without implying that
  // past (already-fixed) months were also expected to hit this revised number (added 2026-09-23).
  var goal2Svg='';
  if(opts.goal2!=null && opts.goal2FromIndex!=null && opts.goal2FromIndex<n){
    var g2y = y(opts.goal2);
    var g2x = padL + opts.goal2FromIndex*groupW;
    goal2Svg = '<line x1="'+g2x+'" y1="'+g2y+'" x2="'+(W-padR)+'" y2="'+g2y+'" stroke="var(--critical)" stroke-width="1.5" stroke-dasharray="2,3" />';
  }
  var axisSvg = '<line x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(W-padR)+'" y2="'+(padT+plotH)+'" stroke="var(--muted)" stroke-width="1" />';

  // Legend visibility unchanged from before goal2 existed: shown for multi-series charts, or a
  // single-series chart that also has a goal line (otherwise a lone "series name" swatch would be
  // redundant, e.g. Reports' single-bar-per-stockist chart never had one and still shouldn't).
  var showLegend = series.length>1 || opts.goal || opts.goal2!=null;
  var legendSwatches = series.map(function(s){ return '<span class="sw"><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>'; });
  if(opts.goal) legendSwatches.push('<span class="sw"><i style="background:var(--accent)"></i>Target pace</span>');
  if(opts.goal2!=null) legendSwatches.push('<span class="sw"><i style="background:var(--critical)"></i>Revised pace (remaining months)</span>');

  container.innerHTML =
    '<div class="chartHost">'+
      '<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img">'+
        gridSvg+ticksSvg+axisSvg+barsSvg+goalSvg+goal2Svg+labelsSvg+
      '</svg>'+
      '<div class="chartTip" id="ctip"></div>'+
    '</div>'+
    (showLegend ? '<div class="legend">'+legendSwatches.join('')+'</div>' : '');

  var tip = qs('#ctip', container);
  qsa('.barMark', container).forEach(function(rect){
    rect.addEventListener('mousemove', function(e){
      var i = +rect.getAttribute('data-i'), s = +rect.getAttribute('data-s');
      var val = series[s].values[i]||0;
      tip.textContent = labels[i]+' — '+series[s].name+': '+(opts.fmt?opts.fmt(val):val);
      var host = container.querySelector('.chartHost').getBoundingClientRect();
      tip.style.left = (e.clientX - host.left)+'px';
      tip.style.top = (e.clientY - host.top)+'px';
      tip.style.opacity='1';
    });
    rect.addEventListener('mouseleave', function(){ tip.style.opacity='0'; });
  });
}
function niceNumber(v){
  var exp = Math.floor(Math.log10(v||1));
  var base = Math.pow(10, exp);
  var frac = v/base;
  var niceFrac = frac<=1?1: frac<=2?2: frac<=5?5:10;
  return niceFrac*base;
}
function shortNum(v){
  if(v>=100000) return (v/100000).toFixed(v%100000===0?0:1)+'L';
  if(v>=1000) return (v/1000).toFixed(v%1000===0?0:1)+'k';
  return String(Math.round(v));
}

function renderDashboard(c, extra){
  extra.innerHTML = '<span style="font-size:13px;color:var(--ink-soft)">'+fyPickerHtml('dashFy', state.selectedFYStartYear)+'</span>';
  qs('#dashFy', extra).addEventListener('change', function(){ state.selectedFYStartYear = +this.value; render(); });

  var monthsSoFar = months.filter(function(ym){ return ym <= todayYM(); });
  var target = state.settings.target||4200000;
  var achievedTotal = 0;
  allStockistIds().forEach(function(sid){
    achievedTotal += primaryTotalForMonths(sid, months);
  });
  var pct = target? achievedTotal/target*100 : 0;
  var expectedPace = target * (monthsSoFar.length/12);
  var paceDelta = achievedTotal - expectedPace;

  // Revised required pace for the REST of the year, given how this FY has actually gone so far --
  // only meaningful while the FY is genuinely in progress (added 2026-09-23, per Kapil). A past FY
  // has nothing left to revise; a not-yet-started future FY has no actuals yet, so it would just
  // equal the flat target/12 pace anyway -- skip the card/line in both cases rather than show a
  // number that doesn't mean anything.
  var remainingMonths = 12 - monthsSoFar.length;

  var revisedPace = fyInProgress ? Math.max(0, (target-achievedTotal)/remainingMonths) : null;
  var flatPace = target/12;

  var secTotals = latestPartySalesTotals();
  var lowStock = lowStockAlertCount();
  var nearExpiryCount = nearExpiryProductsAcrossStockists().length;
  var birthdaySoonCount = upcomingBirthdays().filter(function(ch){ return ch.daysUntil<=2; }).length;

  var incQuarterKey = quarterKeyOf(todayYM());
  var inc = incentiveCalcForQuarter(incQuarterKey);

  c.innerHTML =
    '<div class="cards">'+
      '<div class="card">'+
        '<div class="eyebrow">FY '+fyLabel(fy)+' Primary Target</div>'+
        '<div class="stat tabular">'+fmtINR(achievedTotal)+'</div>'+
        '<div class="statSub">of '+fmtINR(target)+' target &middot; '+pct.toFixed(1)+'%</div>'+
        '<div class="track"><i style="width:'+clamp(pct,0,100)+'%"></i></div>'+
        '<div class="statSub" style="margin-top:8px">'+(paceDelta>=0? 'Ahead of pace: ':'Behind pace: ')+fmtINR(Math.abs(paceDelta))+'</div>'+
        (fyInProgress ? '<div class="statSub" style="margin-top:4px">Needed per month from now: <strong class="tabular">'+fmtINR(revisedPace)+'</strong>'+(revisedPace>flatPace?' <span style="color:var(--critical)">('+fmtINR(revisedPace-flatPace)+' more than before)</span>':(revisedPace<flatPace?' <span style="color:var(--good)">('+fmtINR(flatPace-revisedPace)+' less than before)</span>':''))+'</div>' : '')+
      '</div>'+
      '<div class="card">'+
        '<div class="eyebrow">Secondary Sales (Party Sales, latest upload)</div>'+
        '<div class="stat tabular">'+fmtINR(secTotals.grand)+'</div>'+
        '<div class="statSub">'+secTotals.rows.map(function(r){ return esc(r.stockistName)+': '+(r.rep? fmtINR(r.total) : 'not uploaded'); }).join(' &middot; ')+'</div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="eyebrow">Quarterly Incentive &mdash; '+esc(quarterLabel(incQuarterKey))+'</div>'+
        '<div class="stat tabular" style="color:var(--good)">'+fmtINR(inc.incentive)+'</div>'+
        '<div class="statSub">'+inc.monthsWithData+' of 3 months entered'+(inc.monthsWithData<3?' &mdash; final number once the quarter is complete':'')+'</div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="eyebrow">Team</div>'+
        '<div class="row between tabular" style="margin-top:4px">'+
          '<div><div style="font-size:12px;color:var(--ink-soft)">Kapil (01 Sep 2026 se)</div><div class="stat" style="font-size:20px">100%</div></div>'+
          '<div style="text-align:right"><div style="font-size:12px;color:var(--ink-soft)">Girish ('+fmtDMY(state.settings.girishFromDate)+' &ndash; '+fmtDMY(state.settings.girishToDate)+')</div><div class="stat" style="font-size:20px">'+fmtINR(state.settings.girishHistoricalTotal||0)+'</div></div>'+
        '</div>'+
        '<div class="statSub" style="margin-top:8px">Girish is no longer part of the team &mdash; this is historical record only (edit on the Primary &amp; Incentive tab).</div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="eyebrow">Needs Attention</div>'+
        '<div class="row" style="margin-top:6px"><span class="pill"><span class="dot '+(lowStock>0?'dot-serious':'dot-good')+'"></span>'+lowStock+' items worth ordering (latest report)</span></div>'+
        '<div class="row" style="margin-top:8px"><span class="pill" id="nearExpiryAlert" style="cursor:pointer"><span class="dot '+(nearExpiryCount>0?'dot-serious':'dot-good')+'"></span>'+nearExpiryCount+' products near-expiry &mdash; clear these out</span></div>'+
        '<div class="row" style="margin-top:8px"><span class="pill" id="birthdaySoonAlert" style="cursor:pointer"><span class="dot '+(birthdaySoonCount>0?'dot-warning':'dot-good')+'"></span>'+birthdaySoonCount+' birthday(s) in next 2 days</span></div>'+
      '</div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="sectionHead"><h2>Monthly primary sales — FY '+fyLabel(fy)+'</h2></div>'+
      '<div id="dashChart" style="margin-top:8px"></div>'+
    '</div>';

  qs('#nearExpiryAlert', c).addEventListener('click', openNearExpiryModal);
  qs('#birthdaySoonAlert', c).addEventListener('click', function(){ goToTab('birthdays'); });

  var values = months.map(function(ym){
    var v=0; allStockistIds().forEach(function(sid){ var p=state.primaryByKey[sid+'_'+ym]; if(p) v+=(p.amount||0); });
    return v;

  renderBarChart(qs('#dashChart'), {

    series: [{name:'Primary sales', color:cssVar('--brand'), values: values}],
    goal: target/12,
    goal2: fyInProgress ? revisedPace : null,
    goal2FromIndex: fyInProgress ? monthsSoFar.length : null,
    fmt: fmtINR
  });
}

    // each pill's count is live from the current report, and clicking it opens the actual product
    // list), placed right under THIS stockist's own PDF card.
    section.appendChild(orderBreakdownCard(s));

    wrap.appendChild(section);
  });

  // Renders the Company Order List / Full Analysis Report / Order List History for whichever
  // stockist is selected (state.ordersSubTab) into #orderRecSection -- reuses renderOrders()
  // completely unchanged, just targeting this sub-container instead of a whole tab, so all of its
  // existing save/PDF/copy/history behaviour keeps working exactly as before the merge.
  function renderOrderRecSection(){
    var sec = qs('#orderRecSection');
    if(sec) renderOrders(sec, extra);
  }
  renderOrderRecSection();
}

// Which of the 7 mutually-exclusive buckets a computeRecommendation() row falls into. Every row
// lands in exactly one bucket (the checks are ordered to match how suggestedQty itself gets
// decided in computeRecommendation), so the 7 counts always add up to the stockist's total product
// count.
var SKIP_REASON_META = {
  toOrder:       {label:'To Order',              dot:'dot-critical', desc:'These products are currently suggested in the Company Order List — their Suggested Order Qty is above 0.'},
  nearExpiry:    {label:'Near Expiry',            dot:'dot-serious',  desc:'Marked &quot;*&quot; (Near Expiry) in the PDF. Products close to expiry are never auto-ordered — this is only a warning flag. Focus on clearing the existing stock of these, don\'t order more.'},
  dead:          {label:'Dead Stock',             dot:'dot-muted',    desc:'No stock movement in 60+ days and sales are near zero — so not included in auto-order.'},
  overstock:     {label:'Overstock',              dot:'dot-warning',  desc:'Stock is 1.5&times; the required quantity or more — no need to order now, sell through this first.'},
  noSale:        {label:'No Sale / Slow Mover',   dot:'dot-muted',    desc:'Daily Sale is very low or zero — not prioritized even at 0 stock, since there\'s no real demand showing.'},
  adequateStock: {label:'Adequate Stock',         dot:'dot-good',     desc:'Sale is going fine, but there\'s already enough stock on hand for the next order cycle — no need to order right now.'},
  schemeGift:    {label:'Scheme / Gift Item',     dot:'dot-muted',    desc:'Looks like a scheme/gift item by name (e.g. FREE / GIFT / ZZ...) — not a real purchasable product, so not added to the Company Order List.'}
};
function classifySkipReason(r){
  // A manual "Add to Order List" override (see addProductToOrderList) always wins — the point of
  // that button is to force a product into the actionable list regardless of what the formula
  // otherwise computed for it, so it must show up under "To Order", not its original bucket.
  if(r.manuallyAdded) return 'toOrder';
  // NOTE: isScheme (name-pattern FREE/GIFT/ZZ/ON.../N+M gift lines, see isLikelyScheme) is checked
  // BEFORE the overstock/no-sale/adequate-stock checks below — otherwise, since gift/scheme lines
  // almost never have real daily-sale velocity, nearly all of them fell through to "No Sale / Slow
  // Mover" instead and the Scheme/Gift bucket showed close to empty even when the PDF clearly had
  // FREE/GIFT/ZZ/ON items (bug Kapil caught, 2026-09-20). This ordering matches the actual Company
  // Order List filter (`(suggestedQty>0 && !isScheme) || manuallyAdded`) — a name-pattern item can
  // never end up in "To Order" on its own, so bucketing it as Scheme/Gift first is consistent.
  if(r.nearExpiry) return 'nearExpiry';
  if(r.isDead) return 'dead';
  if(r.isScheme) return 'schemeGift';
  if(r.flags.indexOf('Overstock')>=0) return 'overstock';
  if(r.suggestedQty<=0) return r.dailySales<=0.05 ? 'noSale' : 'adequateStock';
  return 'toOrder';
}

// Products Kapil force-added to a stockist+report's order list from the breakdown modal (see
// addProductToOrderList) — a plain name array, keyed the same way as finalOrders/weeklyReports.
function manualAddsFor(stockistId, reportDate){
  var doc = state.manualOrderAdds[stockistId+'_'+reportDate];
  return (doc && doc.products) || [];
}
function addProductToOrderList(stockistId, reportDate, product){
  var existing = manualAddsFor(stockistId, reportDate);
  if(existing.indexOf(product)>=0) return;
  docManualOrderAdds(stockistId, reportDate).set({stockistId:stockistId, reportDate:reportDate, products:existing.concat([product])})
    .then(function(){ toast(product+' — added to Order List'); })
    .catch(function(e){ toast(dbErrMsg(e), true); });
}
function removeProductFromOrderList(stockistId, reportDate, product){
  var existing = manualAddsFor(stockistId, reportDate);
  docManualOrderAdds(stockistId, reportDate).set({stockistId:stockistId, reportDate:reportDate, products:existing.filter(function(p){ return p!==product; })})
    .then(function(){ toast(product+' — removed from Order List'); })
    .catch(function(e){ toast(dbErrMsg(e), true); });
}

function orderBreakdownCard(s){
  var card = document.createElement('div');
  card.className='card';
  card.style.marginBottom = '20px';
  var rec = computeRecommendation(s.id);
  if(!rec.asOf){
    card.innerHTML = '<h3>'+esc(s.name)+' &mdash; Order List Breakdown</h3>'+
      '<div class="statSub" style="margin-top:6px">The breakdown will show here once you upload the weekly PDF.</div>';
    return card;
  }
  var counts = {toOrder:0, nearExpiry:0, dead:0, overstock:0, noSale:0, adequateStock:0, schemeGift:0};
  var buckets = {toOrder:[], nearExpiry:[], dead:[], overstock:[], noSale:[], adequateStock:[], schemeGift:[]};
  rec.rows.forEach(function(r){
    var k = classifySkipReason(r);
    counts[k]++; buckets[k].push(r);
  });
  var order = ['toOrder','nearExpiry','overstock','adequateStock','noSale','dead','schemeGift'];
  var pills = order.map(function(key){
    var m = SKIP_REASON_META[key];
    return '<span class="pill" data-reason="'+key+'" style="cursor:pointer;margin:3px 4px 3px 0"><span class="dot '+m.dot+'"></span>'+counts[key]+' '+esc(m.label)+'</span>';
  }).join('');
  card.innerHTML =
    '<div class="row between"><h3>'+esc(s.name)+' &mdash; Order List Breakdown</h3><span class="statSub">as of '+esc(rec.asOf)+' &middot; '+rec.rows.length+' products</span></div>'+
    '<div class="statSub" style="margin:6px 0 10px">Why each product is or isn\'t in the order list &mdash; click any count to see the full list, and add or remove products from the order list manually right there.</div>'+
    '<div>'+pills+'</div>';
  card.addEventListener('click', function(e){
    var pill = e.target.closest('[data-reason]'); if(!pill) return;
    var key = pill.getAttribute('data-reason');
    openBreakdownModal(s.id, s.name, rec.asOf, key, buckets[key]);
  });
  return card;
}

function openBreakdownModal(stockistId, stockistName, reportDate, key, rows){
  var m = SKIP_REASON_META[key];
  var body = '<div class="statSub" style="margin-bottom:10px">'+m.desc+'</div>';
  if(!rows.length){
    body += '<div class="empty" style="padding:16px">No products in this category.</div>';
  } else {
    var sorted = rows.slice().sort(function(a,b){ return b.closingStock - a.closingStock; }); // highest Closing Stock first
    // "To Order" bucket: only the manually-added ones get a Remove button (the rest are already
    // there because the formula itself suggested them — nothing to undo). Every other bucket: every
    // row gets an Add button, since a manually-added product would already have moved into "To
    // Order" (see classifySkipReason) and so never appears here.
    body += '<div class="statSub" style="margin-bottom:8px">Sale and Closing Stock are shown exactly as printed in the PDF Stock Statement (no calculation).</div>'+
      '<div class="tableWrap"><table><thead><tr><th>Product</th><th class="num">Sale (PDF)</th><th class="num">Closing Stock (PDF)</th><th></th></tr></thead><tbody>'+
      sorted.map(function(r){
        var actionHtml = (key==='toOrder')
          ? (r.manuallyAdded ? '<button class="btn btn-sm" data-remove="'+esc(r.product)+'">Remove</button>' : '<span class="statSub">Suggested</span>')
          : '<button class="btn btn-sm btn-primary" data-add="'+esc(r.product)+'">+ Add to Order</button>';
        return '<tr><td>'+esc(r.product)+'</td>'+
          '<td class="num tabular">'+r.pdfSale+'</td>'+
          '<td class="num tabular">'+r.closingStock+'</td>'+
          '<td>'+actionHtml+'</td></tr>';
      }).join('')+
      '</tbody></table></div>';
  }
  openModal(stockistName+' — '+m.label+' ('+rows.length+')', body, {
    footerHtml:'',
    onMount: function(root){
      root.addEventListener('click', function(e){
        var addBtn = e.target.closest('[data-add]');
        var removeBtn = e.target.closest('[data-remove]');
        if(addBtn){
          addProductToOrderList(stockistId, reportDate, addBtn.getAttribute('data-add'));
          addBtn.disabled = true; addBtn.textContent = 'Added ✓';
        } else if(removeBtn){
          removeProductFromOrderList(stockistId, reportDate, removeBtn.getAttribute('data-remove'));
          removeBtn.disabled = true; removeBtn.textContent = 'Removed';
        }
      });
    }
  });
}

function openSalesPartyModal(stockistId, ym, chemistId, party){
  var chem = chemistById(chemistId);
  var body = '<div class="statSub" style="margin-bottom:10px">'+esc(chem?chem.name:'')+' &middot; '+ymLabel(ym)+'</div>'+
    lineItemsEditorHtml((party&&party.items&&party.items.length)?party.items:[{product:'',qty:'',value:''}]);

    onMount: function(root){ wireLineItemsEditor(root); },
    onSave: function(root, btn){
      var items = collectLineItems(root);
      if(items.length===0){ toast('Add at least one product line', true); return; }
      btn.disabled=true;
      var docRef = docSales(stockistId, ym);
      var existing = state.salesByKey[stockistId+'_'+ym];
      var parties = existing ? existing.parties.slice() : [];
      var total = items.reduce(function(s,it){ return s+(it.value||0); }, 0);

      var entry = {chemistId:chemistId, items:items, total:total};

function deleteSalesParty(stockistId, ym, chemistId){

  var grandTotal = parties.reduce(function(s,p){ return s+(p.total||0); }, 0);
  docSales(stockistId, ym).set({stockistId:stockistId, ym:ym, parties:parties, grandTotal:grandTotal, updatedAt:new Date().toISOString()})
    .then(function(){ toast('Entry removed'); })
    .catch(function(e){ toast(dbErrMsg(e),true); });
}

var TREND_LABEL = {up:'&#8593; Badhta', down:'&#8595; Ghatta', flat:'&#8594; Stable', new:'New'};
var MOVE_LABEL = {fast:'Fast', medium:'Medium', slow:'Slow', 'dead/none':'Dead/No sale'};
var PRIORITY_LABEL = {urgent:'Urgent', high:'High', medium:'Medium', low:'Low', occasional:'Occasional', none:'&mdash;'};

function renderOrders(c, extra){
  if(state.stockists.length===0){ c.innerHTML='<div class="empty">Add a Stockist first.</div>'; return; }
  ensureOrdersSubTab();
  extra.innerHTML='';
  var subtabs = '<div class="subtabs">'+state.stockists.map(function(s){
    return '<button data-id="'+s.id+'" class="'+(state.ordersSubTab===s.id?'active':'')+'">'+esc(s.name)+'</button>';
  }).join('')+'</div>';

  var stockistId = state.ordersSubTab;
  var defaultCoverDays = (state.settings.targetCoverDays||15) + (state.settings.safetyDays||5);
  var coverDaysOverride = state.orderCoverDaysOverride[stockistId];
  var effectiveCoverDays = coverDaysOverride!=null ? coverDaysOverride : defaultCoverDays;
  var rec = computeRecommendation(stockistId, effectiveCoverDays);

  if(!rec.asOf){
    c.innerHTML = subtabs+
      '<div class="empty" style="margin-top:16px"><div class="big">&#128203;</div>'+
      esc(stockistName(stockistId))+' has no weekly report yet.<br>'+
      'Send the weekly PDF you get from the stockist (product, current stock, current sale, last month sale) directly in this Claude chat — '+
      'it will be parsed and added here automatically. Once the data is in, the full Analysis Report and Company Order List will be generated here.</div>';
    qsa('.subtabs button', c).forEach(function(b){ b.addEventListener('click', function(){ state.ordersSubTab=b.getAttribute('data-id'); render(); }); });
    return;
  }

  var orderRows = rec.rows.filter(function(r){ return (r.suggestedQty>0 && !r.isScheme) || r.manuallyAdded; });
  var finalKey = stockistId+'_'+rec.asOf;

/* ============================== TAB: PARTY SALES ==============================
   Built from a stockist's "Company-wise Customer-wise Sale" PDF (a party ledger over a date
   range) uploaded in-app — separate from the monthly hand-entered "Sales" tab. Shows the Top
   Parties by amount (descending) and a City-wise breakdown (medical count + top party per
   city), with an inline-editable City per party (for typo corrections like CHANDRPUR vs
   CHANDRAPUR) stored as a per-stockist code->city override layered on top of every uploaded
   period, present or future. */
function ensurePartySalesSubTab(){
  if(state.partySalesSubTab==='combined' && state.stockists.length>1) return;
  if(!state.partySalesSubTab || !state.stockists.some(function(s){return s.id===state.partySalesSubTab;})){
    state.partySalesSubTab = state.stockists[0] ? state.stockists[0].id : null;
  }
}
function partyReportsForStockist(stockistId){
  return Object.keys(state.partyReports)
    .map(function(k){ return Object.assign({key:k}, state.partyReports[k]); })
    .filter(function(r){ return r.stockistId===stockistId; })
    .sort(function(a,b){ return (b.toDate||'').localeCompare(a.toDate||''); }); // newest first
}
function cityOverridesFor(stockistId){
  return (state.partyCityOverrides[stockistId] && state.partyCityOverrides[stockistId].overrides) || {};
}
// ---- Product-wise purchase history (per party) -- separate upload from the Party Sales ledger
// above; only the newest uploaded snapshot per stockist is used (no period-switcher -- this is
// "what do they currently buy", not a trend to look back through).
function productHistoryReportsForStockist(stockistId){
  // state.productHistory holds one entry per CHUNK doc (see docProductHistoryChunk above) -- group
  // the chunks belonging to the same stockist+period back into one logical report, concatenating
  // their customers arrays in chunkIndex order.
  var chunks = Object.keys(state.productHistory)
    .map(function(k){ return Object.assign({key:k}, state.productHistory[k]); })
    .filter(function(r){ return r.stockistId===stockistId; })
    .sort(function(a,b){ return (a.chunkIndex||0)-(b.chunkIndex||0); });
  var byPeriod = {};
  chunks.forEach(function(c){
    var pk = c.fromDate+'_'+c.toDate;
    var g = byPeriod[pk];
    if(!g){ g = {key:pk, stockistId:stockistId, fromDate:c.fromDate, toDate:c.toDate, customers:[], totalValue:c.totalValue, printedGrandTotal:c.printedGrandTotal, uploadedAt:c.uploadedAt}; byPeriod[pk]=g; }
    g.customers = g.customers.concat(c.customers||[]);
    if(c.uploadedAt && c.uploadedAt > g.uploadedAt) g.uploadedAt = c.uploadedAt; // latest chunk's write wins if they ever differ
  });
  return Object.keys(byPeriod).map(function(k){ return byPeriod[k]; })
    .sort(function(a,b){ return (b.toDate||'').localeCompare(a.toDate||''); }); // newest first
}
function latestProductHistoryForStockist(stockistId){
  var reports = productHistoryReportsForStockist(stockistId);
  return reports.length ? reports[0] : null;
}
function productHistoryForCode(stockistId, code){
  var rep = latestProductHistoryForStockist(stockistId);
  if(!rep || !code) return null;
  var c = (rep.customers||[]).find(function(x){ return x.code===code; });
  return c ? {rep:rep, products:c.products||[]} : null;
}
// ---- Near-expiry -> "who to push it to" (best-effort product-name matching) ----
// The stock statement's product name ("Product Name (+ Pack, merged)", see parseStockStatementLine)
// and the Product History upload's product name ("ProductCode ProductName Pack", code stripped --
// see parseProductWiseSalesLine) come from the same stockist software but aren't guaranteed to be
// byte-identical -- pack/strength notation in particular varies ("500MG" vs "500", "10X10" present
// or not). Same spirit as the Combined-view party-name matching above (partyMatchNameKey): strip
// out whatever token varies (there, generic store words; here, any token containing a digit -- the
// pack/strength/qty part) and match on what's left (the drug name itself, order-proof via sort) --
// deliberately an EXACT match on that reduced key, not a fuzzy score, so a near-expiry product with
// no real match shows "no match" rather than risking a wrong party suggested for real stock.
function productMatchKey(name){
  var toks = (name||'').toUpperCase().replace(/[^\w\s]/g,' ').split(/\s+/)
    .filter(function(t){ return t && !/\d/.test(t); }); // drop any token containing a digit
  return toks.sort().join(' ');
}
// Looks at the stockist's latest Product History upload (per-party purchase data) and returns
// the parties who have actually bought this (or a close match of this) product before, ranked by
// how much they bought -- i.e. good candidates to push the near-expiry stock onto. Best-effort:
// if that stockist's Product History was never uploaded, or no party's purchase history matches
// this product closely enough, returns an empty list (shown as "no match" in the UI, not guessed).
function partiesForProductPush(stockistId, productName, limit){
  var rep = latestProductHistoryForStockist(stockistId);
  if(!rep) return [];
  var targetKey = productMatchKey(productName);
  if(!targetKey) return [];
  var matches = [];
  (rep.customers||[]).forEach(function(c){
    (c.products||[]).forEach(function(p){
      if(p.s) return; // skip scheme/gift lines -- not real stock to push
      if(productMatchKey(p.n)===targetKey) matches.push({code:c.code, rawLabel:c.rawLabel, qty:p.q, orders:p.o, lastDate:p.d});
    });
  });
  matches.sort(function(a,b){ return b.qty-a.qty || b.orders-a.orders; });
  return matches.slice(0, limit||3);
}
// Greedily groups a customers array into chunks whose SERIALIZED size stays under maxBytes each --
// used when saving a productHistory report (see openProductHistoryUploadModal's onSave) so a large
// stockist's report never risks the db capability's 256 KiB per-document cap. JSON.stringify(...).length
// is UTF-16 code units, not exact bytes, but the product/party text here is plain ASCII so it's an
// accurate-enough proxy; maxBytes is called with real headroom under the 256 KiB cap for that reason
// plus the doc's other fields. One customer is never split across chunks.
function chunkCustomersForStorage(customers, maxBytes){
  var chunks = [], cur = [], curSize = 2; // 2 = the wrapping "[" + "]"
  customers.forEach(function(c){
    var size = JSON.stringify(c).length + 1; // +1 for the joining comma
    if(cur.length && curSize + size > maxBytes){ chunks.push(cur); cur = []; curSize = 2; }
    cur.push(c);
    curSize += size;
  });
  if(cur.length || !chunks.length) chunks.push(cur);
  return chunks;
}

// ---- Cross-stockist party matching (Combined sub-tab) ----
// Best-effort: the same medical shop is often entered with slightly different generic
// wording in each stockist's own billing software (e.g. "MANOHAR MEDICALS & GEN.STORE" vs
// "MANOHAR MEDICAL & GEN. STORES") but shares its distinctive words and city. The match key
// strips generic store-type words, sorts what's left (order-proof), and combines it with a
// normalized city — verified against the real Sanjivan+Medbricks data (both stockists'
// "Manohar ... Chandrapur" entries correctly group together, while a same-named shop in a
// different city, "Manohar ... Gadchandur", correctly stays separate). Not perfect — a shop
// with a genuinely different registered name per stockist won't auto-merge; fixing a City
// typo via the per-stockist City edit above also improves this matching, since city is half
// of the key, and that correction is picked up here automatically on the next render.
var PARTY_MATCH_STOPWORDS = {MEDICAL:1,MEDICALS:1,MEDICOSE:1,MEDICOES:1,MEDICARE:1,STORE:1,STORES:1,STOR:1,ST:1,GENERAL:1,GENRAL:1,GEN:1,PHARMACY:1,AND:1,TRADERS:1,AGENCY:1,GENERIC:1};
function partyMatchNameKey(name){
  var toks = (name||'').toUpperCase().replace(/[^\w\s]/g,' ').split(/\s+/).filter(function(t){ return t && !PARTY_MATCH_STOPWORDS[t] && !/^\d+$/.test(t); });
  return toks.sort().join(' ');
}
function partyMatchCityKey(city){
  return (city||'').toUpperCase().replace(/[^\w\s]/g,' ').replace(/\d+/g,'').trim().replace(/\s+/g,' ');
}
function partyMatchKey(name, city){ return partyMatchNameKey(name)+'|'+partyMatchCityKey(city); }
// Manual merges (state.partyMerges) let Kapil merge two Combined-view rows that the automatic
// name+city matching above missed -- e.g. a genuine city-spelling mismatch (CHANDRAPUR vs
// CHANDRPUR) or a name too different to share matching non-stopword tokens. Each merge doc maps
// one row's key to the key it should be folded into; resolveMergeKey follows that chain (capped,
// in case of a merge-of-a-merge) to find the final effective group key for a given raw key.
function resolveMergeKey(key, mergeMap){
  var seen = {};
  var cur = key;
  var hops = 0;
  while(mergeMap[cur] && !seen[cur] && hops < 20){
    seen[cur] = 1;
    cur = mergeMap[cur];
    hops++;
  }
  return cur;
}
function partyMergeMapFromState(){
  var mergeMap = {};
  Object.keys(state.partyMerges).forEach(function(id){
    var m = state.partyMerges[id];
    if(m && m.fromKey && m.toKey) mergeMap[m.fromKey] = m.toKey;
  });
  return mergeMap;
}
// Manual CITY merges (state.cityMerges) let Kapil fix a city-spelling mismatch across the WHOLE
// app in one shot -- e.g. Kapil's own report: "GHUGUS" (7 medicals) and "GHUGHUS" (14 medicals)
// in the City-wise table are actually the same town, just typed differently by the stockist's
// billing software. Unlike the per-party City-edit box (fixes one party's city at a time), a
// city merge folds EVERY party under the old spelling into the chosen one, in both the
// per-stockist and Combined City-wise breakdowns, and keeps applying to any future upload too --
// so it's applied once, right where city text is read (partyRowsWithCityForStockist), rather
// than needing to be re-applied at every render site. Keyed by normalized city text
// (partyMatchCityKey) so case/spacing differences don't matter; chains resolve the same way
// party merges do (resolveMergeKey), in case a city is ever merged more than once.
function cityMergeMapFromState(){
  var mergeMap = {}, displayMap = {};
  Object.keys(state.cityMerges).forEach(function(id){
    var m = state.cityMerges[id];
    if(!m || !m.fromKey || !m.toKey) return;
    mergeMap[m.fromKey] = m.toKey;
    if(m.toCity) displayMap[m.toKey] = m.toCity;
  });
  return {mergeMap:mergeMap, displayMap:displayMap};
}
function resolveCityDisplay(city, cm){
  var raw = (city||'').trim();
  if(!raw) return raw;
  var key = partyMatchCityKey(raw);
  if(!key) return raw;
  var finalKey = resolveMergeKey(key, cm.mergeMap);
  return cm.displayMap[finalKey] || raw;
}
function partyRowsWithCityForStockist(stockistId){
  var reports = partyReportsForStockist(stockistId);
  if(!reports.length) return {rep:null, rows:[]};
  var selectedKey = state.partySalesPeriodKey[stockistId];
  var rep = reports.find(function(r){return r.key===selectedKey;}) || reports[0];
  var ov = cityOverridesFor(stockistId);
  var cm = cityMergeMapFromState();
  var rows = (rep.rows||[]).map(function(r){
    var city = (ov[r.code]!=null && ov[r.code]!=='') ? ov[r.code] : (r.city||'');
    city = resolveCityDisplay(city, cm);
    return Object.assign({}, r, {city:city});
  });
  return {rep:rep, rows:rows};
}
function computeCombinedPartyView(){
  var contributors = [];
  var groups = {};
  var mergeMap = partyMergeMapFromState();
  state.stockists.forEach(function(s){
    var d = partyRowsWithCityForStockist(s.id);
    if(!d.rep) return;
    contributors.push({id:s.id, name:s.name, rep:d.rep});
    d.rows.forEach(function(r){
      var rawKey = partyMatchKey(r.name, r.city);
      if(!rawKey.replace(/\|/g,'').trim()) return;
      var key = resolveMergeKey(rawKey, mergeMap);
      var g = groups[key];
      if(!g){ g = {key:key, name:r.name, city:r.city, bestAmount:0, amounts:{}, codes:{}, total:0}; groups[key]=g; }
      g.amounts[s.id] = (g.amounts[s.id]||0) + r.amount;
      g.codes[s.id] = r.code; // this stockist's own customer code for this party -- used to look up its product history
      g.total += r.amount;
      if(r.amount > g.bestAmount){ g.bestAmount = r.amount; g.name = r.name; g.city = r.city; }
    });
  });
  var rows = Object.keys(groups).map(function(k){ return groups[k]; }).sort(function(a,b){ return b.total-a.total; });
  return {contributors:contributors, rows:rows};
}

function isoToDMY(iso){
  if(!iso) return '';
  var p = iso.split('-'); if(p.length!==3) return iso;
  return p[2]+'/'+p[1]+'/'+p[0];
}

          var totalNote = res.printedGrandTotal!=null ?

          var mismatchNote = res.customerTotalMismatches>0 ? ' &mdash; '+res.customerTotalMismatches+' party line-totals had a slight mismatch with the PDF (worth checking).' : '';
          var sample = res.customers.slice(0,5).map(function(c){

      // Split into chunk docs so no single db document risks the 256 KiB cap (a big stockist like
      // Medbricks -- 284 customers, 3300 party-product lines -- serializes to ~400+ KiB as one blob,
      // which the db capability rejects outright). See chunkCustomersForStorage / docProductHistoryChunk.
      var chunkedCustomers = chunkCustomersForStorage(customers, 200*1024);
      var uploadedAt = new Date().toISOString();
      var newKeys = chunkedCustomers.map(function(_, idx){ return stockistId+'_'+fromDate+'_'+toDate+'_c'+idx; });

          return state.productHistory[k].stockistId===stockistId && newKeys.indexOf(k)===-1;
        });
        Promise.all(staleKeys.map(function(k){ return db.doc('productHistory/'+k).delete(); })).catch(function(){});
      }).catch(function(e){ toast(dbErrMsg(e), true); btn.disabled=false; });
    }
  });
}
// ctxs: [{stockistId, stockistName, code, name, city}] -- one per stockist the party appears in
// (per-stockist Party Sales view passes just one; the Combined view can pass up to one per
// contributing stockist, matched via the same name+city key used for the amount totals).
function openPartyProductHistoryModal(ctxs, displayName, displayCity){
  var showScheme = false;
  function buildRows(){
    var combined = [];
    var anyData = false;
    var periodNotes = [];
    ctxs.forEach(function(ctx){
      var found = productHistoryForCode(ctx.stockistId, ctx.code);
      if(!found) return;
      anyData = true;
      periodNotes.push(esc(ctx.stockistName)+': '+found.rep.fromDate+' se '+found.rep.toDate);
      found.products.forEach(function(p){
        combined.push(Object.assign({}, p, {stockist: ctx.stockistName}));
      });
    });
    combined.sort(function(a,b){ return b.o-a.o || b.q-a.q; });
    return {rows: combined, anyData: anyData, periodNotes: periodNotes};
  }
  function render2(root){
    var d = buildRows();
    var body = qs('#pphBody', root);
    if(!d.anyData){
      body.innerHTML = '<div class="empty" style="padding:20px"><div class="big">&#128230;</div>No product-wise data uploaded for this party yet.<br>Upload the stockist&#39;s &ldquo;Customer-Wise Product-Wise Sales&rdquo; PDF from the Party Sales tab.</div>';
      return;
    }
    var multiStockist = ctxs.length>1;
    var visible = d.rows.filter(function(r){ return showScheme || !r.s; });
    var rows = visible.map(function(r){
      return '<tr><td>'+esc(r.n)+(r.s?' <span class="statSub">(scheme/gift)</span>':'')+'</td>'+
        (multiStockist?'<td class="statSub">'+esc(r.stockist)+'</td>':'')+
        '<td class="num tabular">'+r.q+'</td>'+
        '<td class="num tabular">'+r.f+'</td>'+
        '<td class="num tabular">'+r.o+'</td>'+
        '<td class="statSub">'+isoToDMY(r.d)+'</td></tr>';
    }).join('');
    body.innerHTML =
      '<div class="statSub" style="margin-bottom:8px">'+d.periodNotes.join(' &middot; ')+' &mdash; periods may differ, so compare qty/orders only within the same stockist.</div>'+
      '<label class="statSub" style="display:flex;align-items:center;gap:6px;margin-bottom:8px;cursor:pointer"><input type="checkbox" id="pphShowScheme" '+(showScheme?'checked':'')+'> Also show scheme/gift lines</label>'+
      (visible.length===0 ? '<div class="empty" style="padding:14px">No product found.</div>' :
      '<div class="tableWrap"><table><thead><tr><th>Product</th>'+(multiStockist?'<th>Stockist</th>':'')+'<th class="num">Qty</th><th class="num">Free</th><th class="num">Orders</th><th>Last Date</th></tr></thead><tbody>'+rows+'</tbody></table></div>')+
      '<div class="statSub" style="margin-top:8px">&ldquo;Orders&rdquo; = how many separate purchase lines were found (a proxy for frequency) &mdash; the higher this is, the more regularly this product sells.</div>';
    var cb = qs('#pphShowScheme', root);
    if(cb) cb.addEventListener('change', function(){ showScheme = this.checked; render2(root); });
  }
  openModal('Product History — '+displayName+(displayCity?' ('+displayCity+')':''),
    '<div id="pphBody"></div>', {
      footerHtml: '',
      onMount: function(root){ render2(root); }
    });
}
