// Quarterly incentive (added 2026-09-23, Kapil's real company policy): every quarter (calendar
// Jan-Mar/Apr-Jun/Jul-Sep/Oct-Dec) the company deducts a fixed 3-month "base" from Kapil's total
// primary and pays a flat % on whatever's left. Kapil's own primary isn't just Sanjivan+Medbricks
// as entered above though -- two other sales leaders (Pravin, Rahul) have some parties that also
// buy through Sanjivan/Medbricks, so their share gets deducted; and Kapil himself has some parties
// buying through two OTHER stockists (Shri Mahalaxmi Agency and Metro Agency, both in Mul) whose
// primary he doesn't otherwise see in this app, so his share there gets added. In practice none of
// the 4 people have each other's full party-wise sale statements to compute an exact %, so (per
// Kapil, 2026-09-23) these 4 numbers are just told to each other once a quarter and entered here
// as final rupee amounts, rather than the app trying to (wrongly) derive them from data it doesn't
// have.
function combinedPrimaryForMonth(ym){
  var total = 0;
  state.stockists.forEach(function(s){
    var p = state.primaryByKey[s.id+'_'+ym];
    if(p) total += (p.amount||0);
  });
  return total;
}
function incentiveCalcForQuarter(quarterKey){
  var months = quarterMonthsOf(quarterKey);
  var monthly = months.map(function(ym){
    // a month "has data" if at least one stockist has a saved primary row for it
    var hasData = state.stockists.some(function(s){ return !!state.primaryByKey[s.id+'_'+ym]; });
    return {ym:ym, amount: combinedPrimaryForMonth(ym), hasData: hasData};
  });
  var rawPrimary = monthly.reduce(function(sum,m){ return sum+m.amount; }, 0);
  var adj = (state.incentiveAdjustments && state.incentiveAdjustments[quarterKey]) || {pravinDeduction:0, rahulDeduction:0, mahalaxmiAddition:0, metroAddition:0};
  var pravinDeduction = Number(adj.pravinDeduction)||0;
  var rahulDeduction = Number(adj.rahulDeduction)||0;
  var mahalaxmiAddition = Number(adj.mahalaxmiAddition)||0;
  var metroAddition = Number(adj.metroAddition)||0;
  var netPrimary = rawPrimary - pravinDeduction - rahulDeduction + mahalaxmiAddition + metroAddition;
  var base = (Number(state.settings.incentiveBaseAmount)||0) * 3; // always the full quarter's base, per Kapil's formula
  var excess = Math.max(0, netPrimary - base);
  var rate = Number(state.settings.incentiveRate)||0;
  var incentive = excess * (rate/100);
  var monthsWithData = monthly.filter(function(m){ return m.hasData; }).length;
  return {quarterKey:quarterKey, months:monthly, rawPrimary:rawPrimary, pravinDeduction:pravinDeduction, rahulDeduction:rahulDeduction, mahalaxmiAddition:mahalaxmiAddition, metroAddition:metroAddition, netPrimary:netPrimary, base:base, excess:excess, rate:rate, incentive:incentive, monthsWithData:monthsWithData};
}

// ---- Sale For Sure 6 scheme progress ----
// A chemist's real purchase amount doesn't live on the chemist record itself -- it lives in the
// Party Sales data (uploaded stockist PDFs), combined across stockists exactly like the Combined
// Party Sales view (computeCombinedPartyView, respecting city/party merges and whichever period
// is currently selected per stockist -- i.e. "latest known purchase total", same number Kapil
// already sees on the Party Sales tab). So a chemist is linked to one Combined-view row (by its
// key) once, at target-setting time (openChemistModal's party picker) -- from then on, purchase-
// so-far always reads live off that same Combined row, so uploading a newer Party Sales report
// naturally moves scheme progress forward with zero extra bookkeeping.
function combinedPartyByKey(key){
  if(!key) return null;
  var data = computeCombinedPartyView();
  return data.rows.find(function(r){ return r.key===key; }) || null;
}
// Balance-over-remaining-time is deliberately the ONLY math here (no separate month-by-month
// ledger) -- Kapil's own spec: "kam liya to next month balance add ho, zyada liya to us hisab se
// calculate ho". Recomputing balance/monthsLeft fresh every time already does exactly that: a
// short month enlarges the balance, which automatically raises every future month's required
// pace, and a big month shrinks it just as automatically -- no carry-forward bookkeeping needed.
function schemeProgressForChemist(ch){
  var slab = schemeSlabByLevel(ch.schemeLevel);
  if(!slab) return null;
  var linked = ch.schemeLinkKey ? combinedPartyByKey(ch.schemeLinkKey) : null;
  var purchased = linked ? linked.total : 0;
  var target = slab.amount;
  var balance = Math.max(0, target - purchased);
  var todayISO = new Date().toISOString().slice(0,10);
  var start = state.settings.schemeStartDate || '2026-04-01';
  var end = state.settings.schemeEndDate || '2027-02-28';
  var daysLeft = Math.max(0, daysBetween(todayISO, end));
  var monthsList = monthsRemainingList(end); // current month through scheme-end month -- same list drives the monthly-pace graph, so text and chart always agree
  var monthsForPacing = Math.max(1, monthsList.length);
  var perMonth = balance>0 ? balance/monthsForPacing : 0;
  var pct = target>0 ? Math.min(100, Math.round(purchased/target*100)) : 0;
  // "Ab tak average kitna monthly liya hai" (Kapil, 2026-09) -- purchased so far divided by how
  // many months have elapsed since the scheme's own start date (not the target date), so this
  // reads as the chemist's actual running pace, comparable against perMonth (the pace still
  // needed) to see if they're on track.
  var monthsElapsed = monthsElapsedList(start).length;
  var avgMonthlySoFar = monthsElapsed>0 ? purchased/monthsElapsed : purchased;
  return {slab:slab, linked:linked, purchased:purchased, target:target, balance:balance, daysLeft:daysLeft, monthsList:monthsList, perMonth:perMonth, monthsElapsed:monthsElapsed, avgMonthlySoFar:avgMonthlySoFar, pct:pct, achieved: purchased>=target, start:start, end:end};
}
function schemeProgressPillHtml(ch){
  var prog = schemeProgressForChemist(ch);
  if(!prog) return '<span class="statSub">&mdash;</span>';
  var dotClass = prog.achieved ? 'dot-good' : (prog.pct>=60 ? 'dot-warning' : 'dot-critical');
  // Was a plain .pill (info-only styling, no border/hover) even though clicking it opens the full
  // breakdown -- Kapil couldn't tell it was clickable ("l7 -42% pr click krna padta hai o button
  // jaisa hona chahiye"). Switched to .btn.btn-sm (bordered, hover state, same as every other
  // clickable control in the app) and added the word "Track" so the click affordance is explicit,
  // not just implied by cursor:pointer.
  return '<button type="button" class="btn btn-sm schemeProgBtn" data-id="'+esc(ch.id)+'">'+
    '<span class="dot '+dotClass+'"></span>L'+prog.slab.level+' &middot; '+prog.pct+'% &middot; Track</button>';
}

  var prog = schemeProgressForChemist(ch);

  } else {
    var barPct = Math.min(100, prog.pct);
    // Compare the actual running pace (avgMonthlySoFar) against the pace still needed
    // (perMonth) -- green if on/ahead of pace, red if behind, so Kapil can tell at a glance
    // whether the chemist's current buying habit will get them there in time.
    var onPace = prog.achieved || prog.avgMonthlySoFar >= prog.perMonth;
    body =
      '<div class="statSub" style="margin-bottom:4px">Target &mdash; Level '+prog.slab.level+'</div>'+
      '<div style="font-weight:700;margin-bottom:12px">'+esc(prog.slab.article)+'</div>'+

      '<div class="track" style="margin-bottom:14px"><i style="width:'+barPct+'%"></i></div>'+

        '<div class="card" style="padding:12px"><div class="eyebrow">Target</div><div class="stat" style="font-size:19px">'+fmtINR(prog.target)+'</div></div>'+

var KAPIL_CONTACT_NAME = 'Kapil Choudhari';

// Reformats one raw gift-article clause (from SALE_FOR_SURE_6_SLABS' " A OR B OR C " strings,
// already split on " OR ") into the punchier bulleted style Kapil asked for 2026-09-12 (he sent a
// screenshot comparing the flat original vs. a WhatsApp-bold demo and said the 2nd/bold one is
// what he wants): a trailing simple size/qty clarifier in parentheses -- "(7KG)", "(20 Pcs)" --
// becomes " – 7 KG" / " – 20 Pcs" (digit+letter runs get a space, e.g. "7KG" -> "7 KG"); a bare
// trailing rupee figure with no "/-" yet (e.g. "Firm Name Cheque ₹12,000") gets an en-dash before
// it and a "/-" suffix, matching the Total Target/Purchase Done style used elsewhere in this
// message. A parenthetical that itself contains "₹" or "worth" (e.g. "(24 Pcs worth ₹2,400/-)",
// "(10% TDS deducted)" mid-sentence) or one that isn't at the very end of the clause is left
// alone -- those read better staying as plain parentheses.
function giftOptionDisplay(raw){
  var s = String(raw||'').trim();
  var m = s.match(/^(.*\S)\s*\(([^()]+)\)\s*$/);
  if(m && !/[₹]|worth/i.test(m[2])){
    var clarifier = m[2].replace(/(\d)([A-Za-z])/g, '$1 $2');
    s = m[1] + ' – ' + clarifier;
  }
  var m2 = s.match(/^(.*\S)\s+(₹[\d,]+(?:\.\d+)?)$/); // only a BARE trailing amount (no existing "/-")
  if(m2){ s = m2[1] + ' – ' + m2[2] + '/-'; }
  return s;
}

// Matches a roster row's name against the existing Top-70 chemist list the same way everywhere
// (trim + collapse inner whitespace + uppercase) so "Dwarka Medical Stores" and "DWARKA MEDICAL
// STORES " land on the same record instead of creating a duplicate.
function normChemistName(s){ return String(s||'').trim().replace(/\s+/g,' ').toUpperCase(); }
function openChemistRosterUploadModal(){
  var parsed = null;
  var body =
    '<div class="statSub" style="margin-bottom:10px">Excel file columns: <strong>Chemist Name</strong> (required), <strong>Area</strong> and <strong>DOB</strong> (both optional). A name already in the list gets its Area/DOB updated; a new name gets added. No record is ever deleted.</div>'+
    '<div class="field"><label class="lbl">Chemist List file (.xlsx)</label><input type="file" id="crFile" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></div>'+
    '<div id="crPreview" style="margin-top:6px"></div>';
  openModal('Upload Chemist List (Excel)', body, {
    footerHtml: '<button class="btn btn-primary" id="mSave" disabled>Save</button>',
    onMount: function(root){
      qs('#crFile', root).addEventListener('change', function(e){
        var file = e.target.files[0];
        var preview = qs('#crPreview', root);
        var saveBtn = qs('#mSave');
        parsed = null;
        saveBtn.disabled = true;
        if(!file) return;
        preview.innerHTML = '<div class="statSub">Reading file&hellip;</div>';
        parseChemistRosterWorkbook(file).then(function(res){
          if(res.headerError){
            preview.innerHTML = '<div class="statSub" style="color:var(--critical)">Couldn\'t find a Chemist Name column in this file. First row should have headers like &ldquo;Chemist Name&rdquo;, &ldquo;Area&rdquo;, &ldquo;DOB&rdquo;.</div>';
            return;
          }
          if(!res.rows.length){
            preview.innerHTML = '<div class="statSub" style="color:var(--critical)">No chemist rows found in this file.</div>';
            return;
          }
          var existingByName = {};
          state.chemists.forEach(function(ch){ (existingByName[normChemistName(ch.name)] = existingByName[normChemistName(ch.name)]||[]).push(ch); });
          var willAdd=0, willUpdate=0, ambiguous=0, withDob=0;
          res.rows.forEach(function(r){
            var matches = existingByName[normChemistName(r.name)] || [];
            if(matches.length===0) willAdd++;
            else if(matches.length===1) willUpdate++;
            else ambiguous++;
            if(r.dob) withDob++;
          });
          parsed = res;
          preview.innerHTML =
            '<div class="statSub" style="margin-bottom:4px"><strong>'+res.rows.length+' row(s)</strong> parsed'+(res.skipped?', '+res.skipped+' skipped (blank name)':'')+'.</div>'+
            '<div class="statSub" style="margin-bottom:4px">'+willAdd+' new chemist(s) will be added, '+willUpdate+' existing chemist(s) will be updated, '+withDob+' row(s) have a readable DOB.</div>'+
            (res.unreadableDob ? '<div class="statSub" style="color:var(--warning,#b45309);margin-bottom:4px">'+res.unreadableDob+' row(s) had a DOB Claude/the app couldn\'t read (saved without DOB &mdash; fix in the Birthdays tab).</div>' : '')+
            (ambiguous ? '<div class="statSub" style="color:var(--critical);margin-bottom:4px">'+ambiguous+' row(s) match more than one existing chemist with the same name &mdash; skipped, please fix duplicates in the app first.</div>' : '');
          saveBtn.disabled = false;
        }).catch(function(err){
          preview.innerHTML = '<div class="statSub" style="color:var(--critical)">Could not read file: '+esc(err && err.message ? err.message : 'something went wrong')+'</div>';
        });
      });
    },
    onSave: function(root, btn){
      if(!parsed || !parsed.rows.length){ toast('Pehle file parse hone dein', true); return; }
      btn.disabled = true;
      var existingByName = {};
      state.chemists.forEach(function(ch){ (existingByName[normChemistName(ch.name)] = existingByName[normChemistName(ch.name)]||[]).push(ch); });
      var jobs = [], added=0, updated=0, skipped=0;
      parsed.rows.forEach(function(r){
        var matches = existingByName[normChemistName(r.name)] || [];
        if(matches.length>1){ skipped++; return; } // ambiguous duplicate -- leave alone, already flagged in preview
        var payload = {};
        if(r.area) payload.area = r.area;
        if(r.dob) payload.birthday = r.dob;
        if(matches.length===1){
          if(Object.keys(payload).length){ jobs.push(colChemists().doc(matches[0].id).update(payload)); updated++; }
        } else {
          payload.name = r.name;
          jobs.push(colChemists().doc(uid()).set(payload));
          added++;
        }
      });
      if(!jobs.length){ toast('Nothing new to save', true); btn.disabled=false; return; }
      Promise.all(jobs).then(function(){
        toast(added+' added, '+updated+' updated'+(skipped?', '+skipped+' skipped (duplicate name)':'')); closeModal();
      }).catch(function(e){ toast(dbErrMsg(e,'Some rows could not be saved'), true); btn.disabled=false; });
    }
  });
}
// Added 2026-09-25 per Kapil: while waiting for his Excel sheet with DOBs, he wants the chemist
// list filled in right away from data the app already has -- the Party Sales -> City-wise
// (Combined) medical list (computeCombinedPartyView(), the same one shown on that tab). This adds
// a chemist record (name + area=city) for every medical there that isn't already a chemist, with
// no birthday -- he'll add birthdays himself as he visits each city ("jab bhi mai us city mai
// jaunga to manually add kr lunga"). Deliberately reuses computeCombinedPartyView() itself instead
// of re-deriving the party/city list from raw data, so the count Kapil sees here always matches
// exactly what's on the Party Sales tab (same merges, same de-duplication).
function openAddChemistsFromPartySalesModal(){
  var combined = computeCombinedPartyView();
  if(!combined.rows.length){
    openModal('Add Chemists from Party Sales', '<div class="statSub">No Party Sales data uploaded yet. Upload a report in the Party Sales tab first.</div>', {hideCancel:true, footerHtml:'<button class="btn btn-primary" id="mCancel">Close</button>'});
    return;
  }
  var existingByName = {};
  state.chemists.forEach(function(ch){ (existingByName[normChemistName(ch.name)] = existingByName[normChemistName(ch.name)]||[]).push(ch); });
  var toAdd = combined.rows.filter(function(r){ return !(existingByName[normChemistName(r.name)]||[]).length; });
  var alreadyThere = combined.rows.length - toAdd.length;
  var byCity = {};
  toAdd.forEach(function(r){ (byCity[r.city||'Unknown']=byCity[r.city||'Unknown']||[]).push(r); });
  var cityCount = Object.keys(byCity).length;
  var body =
    '<div class="statSub" style="margin-bottom:10px">This uses the medical list already in Party Sales &rarr; City-wise (Combined) and adds every one not already in your chemist list, with its area set. No birthday is set — add those yourself as you visit each city.</div>'+
    '<div class="statSub" style="margin-bottom:10px"><strong>'+toAdd.length+' new chemist(s)</strong> will be added, across <strong>'+cityCount+' city/area(s)</strong>.'+(alreadyThere? ' '+alreadyThere+' are already in your chemist list and will be skipped.':'')+'</div>';
  openModal('Add Chemists from Party Sales', body, toAdd.length ? {
    footerHtml: '<button class="btn btn-primary" id="mSave">Add '+toAdd.length+' Chemist(s)</button>',
    onSave: function(root, btn){
      btn.disabled = true;
      var jobs = toAdd.map(function(r){ return colChemists().doc(uid()).set({name:r.name, area:r.city||''}); });
      toast('Adding '+jobs.length+' chemists…');
      Promise.all(jobs).then(function(){ toast(jobs.length+' chemists added'); closeModal(); })
        .catch(function(e){ toast(dbErrMsg(e,'Some chemists could not be added'), true); btn.disabled=false; });
    }
  } : {hideCancel:true, footerHtml:'<button class="btn btn-primary" id="mCancel">Close</button>'});
}

function renderChemists(c, extra){
  extra.innerHTML = '<input type="search" id="chemSearch" class="searchBox" placeholder="Search chemist / party…"> <button class="btn btn-primary" id="addChem">+ Add Chemist</button>';
  qs('#addChem', extra).addEventListener('click', function(){ openChemistModal(null); });

  var search = (window.__chemSearch||'').toLowerCase();
  qs('#chemSearch', extra).value = window.__chemSearch||'';
  qs('#chemSearch', extra).addEventListener('input', debounce(function(){ window.__chemSearch=this.value; renderKeepFocus(); }, 200));

  // "Sale For Sure 6" is a per-chemist TARGET tracker -- it should only ever list chemists that
  // actually have a target set (ch.schemeLevel), not every record in state.chemists. That
  // distinction didn't matter when state.chemists only held the curated Top-70 list, but after the
  // "Add from Party Sales" bulk-add (Birthdays tab, 2026-09-25) it can hold hundreds of medicals
  // with no scheme target at all, which were flooding this table with "All Cities (546)" and rows
  // of "—" (Kapil: "click krne ke bad o party jo add kiye ye target un party o ke list aani
  // chahiye" -- only chemists a target was actually set for should show here).
  var chemistsWithTarget = state.chemists.filter(function(ch){ return ch.schemeLevel!=null && ch.schemeLevel!==''; });
  var list = chemistsWithTarget.filter(function(ch){
    if(!search) return true;
    return (ch.name||'').toLowerCase().indexOf(search)>=0 || (ch.schemeLinkLabel||'').toLowerCase().indexOf(search)>=0;
  });

  var sureSixHtml;
  var cityFilterHtml = '';
  if(chemistsWithTarget.length===0){
    sureSixHtml = '<div class="empty"><div class="big">🎁</div>No chemists added yet.<br>Build your Top 70 chemists list here — add names and set their &ldquo;Sale For Sure 6&rdquo; scheme target.</div>';
  } else {
    // Look up each chemist's linked party ONCE via a shared combinedView snapshot (not per-row
    // via combinedPartyByKey, which would recompute the full cross-stockist merge on every row --
    // expensive with 70 chemists) so Name and City can be shown as separate columns (Kapil,
    // 2026-09-12: "chemist ki city bhi add krni padegi", plus Name should be bold).
    var combinedView = computeCombinedPartyView();
    var withCity = list.map(function(ch){
      var linked = ch.schemeLinkKey ? combinedView.rows.find(function(r){ return r.key===ch.schemeLinkKey; }) : null;
      return { ch:ch, displayName: linked ? linked.name : (ch.name || '—'), displayCity: linked ? (linked.city || '—') : '—' };
    });
    // 2026-09-20, per Kapil: City dropdown to jump straight to one city's chemists instead of
    // scrolling the whole Top-70 list. Options come from cities actually present (post-search),
    // sorted with a count each; window.__sureSixCityFilter persists across re-renders same as
    // window.__chemSearch above.
    var cityCounts = {};
    withCity.forEach(function(x){ cityCounts[x.displayCity] = (cityCounts[x.displayCity]||0)+1; });
    var cityOptions = Object.keys(cityCounts).sort(function(a,b){ return a.localeCompare(b); });
    var cityFilter = window.__sureSixCityFilter || '';
    if(cityFilter && cityOptions.indexOf(cityFilter)===-1) cityFilter = ''; // selected city no longer present (e.g. search narrowed it out)
    if(cityOptions.length>1){
      cityFilterHtml = '<div class="field" style="max-width:260px;margin-bottom:10px">'+
        '<label class="lbl">Filter by City</label>'+
        '<select id="sureSixCityFilter"><option value=""'+(cityFilter===''?' selected':'')+'>All Cities ('+withCity.length+')</option>'+
        cityOptions.map(function(city){ return '<option value="'+esc(city)+'"'+(cityFilter===city?' selected':'')+'>'+esc(city)+' ('+cityCounts[city]+')</option>'; }).join('')+
        '</select></div>';
    }
    var filtered = cityFilter ? withCity.filter(function(x){ return x.displayCity===cityFilter; }) : withCity;
    var rows = filtered.map(function(x){
      var ch = x.ch;
      return '<tr>'+
        '<td style="font-weight:700">'+esc(x.displayName)+'</td>'+
        '<td>'+esc(x.displayCity)+'</td>'+
        '<td>'+schemeProgressPillHtml(ch)+'</td>'+
        '<td><button class="btn btn-sm editChem" data-id="'+ch.id+'">Edit</button> <button class="btn btn-sm btn-danger delChem" data-id="'+ch.id+'">Del</button></td>'+
        '</tr>';
    }).join('');
    sureSixHtml =
      '<div class="statSub">The &ldquo;Scheme&rdquo; column is the &ldquo;Sale For Sure 6&rdquo; target &mdash; click the badge on a row to see the full breakdown (Medbricks + Sanjivan purchase, balance, per-month pace).</div>'+
      cityFilterHtml+
      (filtered.length ?
        '<div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>Name</th><th>City</th><th>Scheme (Sale For Sure 6)</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
        : '<div class="empty" style="padding:16px">No chemists in this city.</div>');
  }

  // Chemist Visit Coverage ("0 visit" tracking) used to render as a second card right here --
  // moved out into its own "My Route & Visits" tab 2026-09-25 per Kapil. Sale For Sure 6 keeps the
  // same collapsible pattern as before (isCardExpanded) -- title shows by default, tap to open.
  c.innerHTML =
    '<div class="card">'+
      collapsibleCardHeaderHtml('sureSixCard', '🎁 Sale For Sure 6 — Yearly Scheme (per-chemist target tracker)', '')+
      '<div class="cardBody"'+(isCardExpanded('sureSixCard')?'':' hidden')+' style="margin-top:10px">'+sureSixHtml+'</div>'+
    '</div>'+
    otherSchemesHtml();

  qsa('.schemeProgBtn', c).forEach(function(b){ b.addEventListener('click', function(){ openChemistSchemeModal(chemistById(b.getAttribute('data-id'))); }); });
  qsa('.editChem', c).forEach(function(b){ b.addEventListener('click', function(){ openChemistModal(chemistById(b.getAttribute('data-id'))); }); });
  qsa('.delChem', c).forEach(function(b){ b.addEventListener('click', function(){
    var ch = chemistById(b.getAttribute('data-id'));
    openModal('Delete '+ch.name+'?', '<p>This will only delete the chemist record. The name will still appear as a reference in older sales entries.</p>', {
      footerHtml:'<button class="btn btn-danger" id="mSave">Delete</button>',
      onSave: function(root, btn){ btn.disabled=true; colChemists().doc(ch.id).delete().then(function(){toast('Deleted');closeModal();}).catch(function(e){toast(dbErrMsg(e),true);btn.disabled=false;}); }
    });
  });});
  var citySelect = qs('#sureSixCityFilter', c);
  if(citySelect) citySelect.addEventListener('change', function(){ window.__sureSixCityFilter = this.value; renderKeepFocus(); });

  wireCollapsibleCards(c);
  wireOtherSchemesShare(c);
}
function openChemistModal(ch){
  var isNew=!ch;
  var combined = computeCombinedPartyView(); // snapshot for the party-link picker below -- see schemeProgressForChemist's comment for why linking works this way
  var selectedLinkKey = ch ? (ch.schemeLinkKey||null) : null;
  // Order: link-to-party search first, then name, then scheme target -- per Kapil, since picking a
  // party fills in the name for you, it should come before the name field, not after ("link krne ki
  // line upar honi chahiye uske niche fir name aayega fir uske niche schemes target select krne ka
  // option"). The auto-fill-name-on-pick logic below (updateSelectedLabel/renderLinkList) still
  // targets #fName/#fSchemeLevel by id, so it works the same regardless of field order.
  var body =
    '<div class="field"><label class="lbl">Link to a Party Sales record (to track purchases)</label>'+
      '<input type="search" id="fLinkSearch" class="searchBox" style="max-width:none" placeholder="Search by party/medical name…">'+
      '<div id="linkPickList" style="max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--radius-s);margin-top:6px"></div>'+
      '<div class="statSub" id="linkSelectedLabel" style="margin-top:6px"></div>'+
    '</div>'+
    '<div class="field" style="margin-top:4px"><label class="lbl">Chemist / Medical Name</label><input type="text" id="fName" value="'+esc(ch?ch.name:'')+'"><div class="statSub">Selecting a party above will fill this in automatically — you can still edit it if you want.</div></div>'+
    '<div class="field" style="margin-top:4px"><label class="lbl">Scheme Target (Sale For Sure 6)</label><select id="fSchemeLevel">'+
      '<option value="">&mdash; No scheme target &mdash;</option>'+
      SALE_FOR_SURE_6_SLABS.map(function(s){ return '<option value="'+s.level+'" '+((ch&&Number(ch.schemeLevel)===s.level)?'selected':'')+'>Level '+s.level+' &mdash; '+fmtINR(s.amount)+' &mdash; '+esc(s.article)+'</option>'; }).join('')+
    '</select></div>';
  openModal(isNew?'Add Chemist':'Edit Chemist', body, {
    onMount: function(root){
      function updateSelectedLabel(){
        var lbl = qs('#linkSelectedLabel', root);
        if(combined.rows.length===0){ lbl.innerHTML = 'No report uploaded in Party Sales yet — upload one in the Party Sales tab first.'; return; }
        if(!selectedLinkKey){ lbl.innerHTML = 'No party linked.'; return; }
        var r = combined.rows.find(function(x){ return x.key===selectedLinkKey; });
        if(!r){ lbl.innerHTML = 'Linked party (will be re-matched when new Party Sales data is uploaded).'; return; }
        var breakdown = state.stockists.map(function(s){
          return '<span style="margin-right:12px">'+esc(s.name)+': <strong>'+fmtINR(r.amounts[s.id]||0)+'</strong></span>';
        }).join('');
        lbl.innerHTML = '<div>Linked: <strong>'+esc(r.name)+'</strong> ('+esc(r.city||'—')+')</div>'+
          '<div style="margin-top:4px">'+breakdown+'</div>'+
          '<div style="margin-top:4px">Combined total: <strong>'+fmtINR(r.total)+'</strong></div>';
      }
      function renderLinkList(){
        var term = qs('#fLinkSearch', root).value.trim().toLowerCase();
        var list = combined.rows;
        if(term) list = list.filter(function(r){ return (r.name||'').toLowerCase().indexOf(term)>=0 || (r.city||'').toLowerCase().indexOf(term)>=0; });
        list = list.slice(0,60);
        qs('#linkPickList', root).innerHTML = list.length===0 ? '<div class="statSub" style="padding:8px">No matching party found.</div>' :
          list.map(function(r){
            var sel = r.key===selectedLinkKey;
            return '<div class="linkPickRow" data-key="'+esc(r.key)+'" style="padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line-soft);'+(sel?'background:var(--brand-soft)':'')+'"><strong>'+esc(r.name)+'</strong> <span class="statSub">'+esc(r.city||'')+' &middot; '+fmtINR(r.total)+'</span></div>';
          }).join('');
        qsa('.linkPickRow', root).forEach(function(row){
          row.addEventListener('click', function(){
            selectedLinkKey = row.getAttribute('data-key');
            var picked = combined.rows.find(function(x){ return x.key===selectedLinkKey; });
            var nameInp = qs('#fName', root);
            if(picked && nameInp && !nameInp.value.trim()) nameInp.value = picked.name;
            updateSelectedLabel(); renderLinkList();
          });
        });
      }
      if(combined.rows.length>0){ renderLinkList(); qs('#fLinkSearch', root).addEventListener('input', debounce(renderLinkList, 150)); }
      else { qs('#linkPickList', root).innerHTML = '<div class="statSub" style="padding:8px">No report uploaded in Party Sales yet.</div>'; }
      updateSelectedLabel();
    },
    onSave: function(root, btn){
      var name = qs('#fName',root).value.trim();
      if(!name){ toast('Name is required', true); return; }
      var levelRaw = qs('#fSchemeLevel',root).value;
      var linkedRow = selectedLinkKey ? combined.rows.find(function(x){ return x.key===selectedLinkKey; }) : null;
      var payload = {
        name:name,
        schemeLevel: levelRaw ? Number(levelRaw) : null,
        schemeLinkKey: selectedLinkKey || null,
        schemeLinkLabel: linkedRow ? (linkedRow.name+(linkedRow.city?(', '+linkedRow.city):'')) : (ch ? (ch.schemeLinkLabel||null) : null)
      };
      btn.disabled=true;
      var ref = isNew? colChemists().doc(uid()) : colChemists().doc(ch.id);
      ref.set(payload).then(function(){ toast('Saved'); closeModal(); }).catch(function(e){ toast(dbErrMsg(e),true); btn.disabled=false; });
    }
  });
}

// Kapil wants to save each purchasing chemist's birthday and get a heads-up before it (2026-09-23).
// Stored as an optional `birthday` field ("YYYY-MM-DD") directly on the existing chemist record --
// a birthday is naturally that chemist's own property, so no separate collection is needed. This
// tab is the dedicated place to see upcoming birthdays and add/remove one for any chemist; the
// Dashboard's "Needs Attention" card (see renderDashboard) surfaces a count once any birthday is
// within the next 2 days, using the same nextBirthdayOccurrence()/daysBetween() helpers.
/* ============================== BIRTHDAY PUSH NOTIFICATIONS ==============================
   Real phone/browser alerts (2 days and 1 day before a chemist's birthday) WITHOUT the app being
   open, per Kapil's request 2026-09-24. This is standard Web Push: a service worker (sw.js,
   deployed alongside index.html) receives the push event and shows the OS notification; the
   browser generates a "subscription" (endpoint + keys) tied to a VAPID key pair, which gets saved
   to a new public.push_subscriptions table; a Supabase Edge Function + a daily Supabase Cron job
   (both set up by Kapil himself, same "[Production Deploy]" classifier restriction as everything
   else server-side) checks every chemist's birthday once a day and sends the push. The PUBLIC key
   below is safe to ship in client code -- only the matching PRIVATE key (kept as a Supabase Edge
   Function secret, never here) can actually sign/send a push.
   iOS note: Web Push only works there if the site is added to the Home Screen (Settings > Safari
   doesn't matter, this is a Safari/iOS 16.4+ platform limitation) -- Android Chrome works directly. */
var VAPID_PUBLIC_KEY = 'BCCyUyhBIjkYqp_-bHNaOvABfehzbOVcdNIYhdSw04bTFeS59-iMstlZ5r5nrFmRw8ZBVPHC5CalKIv91OAy_94';
function urlBase64ToUint8Array(base64String){
  var padding = '='.repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  var rawData = atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for(var i=0;i<rawData.length;++i){ outputArray[i] = rawData.charCodeAt(i); }
  return outputArray;
}
function pushSupported(){
  return ('serviceWorker' in navigator) && ('PushManager' in window) && (typeof Notification !== 'undefined');
}
function registerPushServiceWorker(){
  if(!pushSupported()) return Promise.resolve(null);
  return navigator.serviceWorker.register('/sw.js').catch(function(){ return null; });
}
function enableBirthdayPush(){
  if(!pushSupported()){ toast('This browser/device does not support push notifications', true); return; }
  Notification.requestPermission().then(function(perm){
    if(perm !== 'granted'){ toast('Notification permission not granted'); renderPushStatusArea(); return; }
    registerPushServiceWorker().then(function(reg){
      if(!reg){ toast('Could not register the service worker', true); return; }
      reg.pushManager.getSubscription().then(function(existing){
        return existing || reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
      }).then(function(sub){
        var raw = sub.toJSON();
        return supa.from('push_subscriptions').upsert({
          user_id: state.currentUser.id,
          endpoint: raw.endpoint,
          p256dh: raw.keys.p256dh,
          auth_key: raw.keys.auth
        }, {onConflict:'endpoint'});
      }).then(function(res){
        if(res && res.error){ toast(dbErrMsg(res.error), true); return; }
        toast('Birthday reminders turned ON for this phone/browser');
        renderPushStatusArea();
      }).catch(function(e){ toast('Something went wrong: '+(e&&e.message||e), true); });
    });
  });
}
function disableBirthdayPush(){
  if(!pushSupported()) return;
  navigator.serviceWorker.getRegistration('/sw.js').then(function(reg){
    if(!reg) return;
    reg.pushManager.getSubscription().then(function(sub){
      if(!sub) return;
      var endpoint = sub.endpoint;
      sub.unsubscribe().then(function(){
        supa.from('push_subscriptions').delete().eq('endpoint', endpoint).then(function(){
          toast('Birthday reminders turned off');
          renderPushStatusArea();
        });
      });
    });
  });
}
// Fills #pushStatusArea (inside the Birthdays tab's "Phone Reminders" card) -- async because
// checking the current subscription state requires a couple of promise round-trips, so the card
// renders with an empty placeholder first and this fills it in a moment later.
function renderPushStatusArea(){
  var area = qs('#pushStatusArea');
  if(!area) return;
  if(!pushSupported()){
    area.innerHTML = '<span class="pill"><span class="dot dot-muted"></span>This browser/device does not support push notifications</span>';
    return;
  }
  if(Notification.permission === 'denied'){
    area.innerHTML = '<span class="pill"><span class="dot dot-critical"></span>Permission blocked</span>'+
      '<div class="statSub" style="margin-top:6px">Turn on Notifications for this app in your browser\'s site settings, then come back here.</div>';
    return;
  }
  navigator.serviceWorker.getRegistration('/sw.js').then(function(reg){
    return reg ? reg.pushManager.getSubscription() : null;
  }).then(function(sub){
    if(!qs('#pushStatusArea')) return; // tab changed while this was in flight
    if(sub){
      area.innerHTML = '<span class="pill"><span class="dot dot-good"></span>Reminders are ON for this phone/browser</span> <button class="btn btn-sm" id="pushDisableBtn" style="margin-left:8px">Turn off</button>';
      qs('#pushDisableBtn', area).addEventListener('click', disableBirthdayPush);
    } else {
      area.innerHTML = '<button class="btn btn-primary btn-sm" id="pushEnableBtn">Enable reminders on this phone</button>';
      qs('#pushEnableBtn', area).addEventListener('click', enableBirthdayPush);
    }
  }).catch(function(){
    area.innerHTML = '<button class="btn btn-primary btn-sm" id="pushEnableBtn">Enable reminders on this phone</button>';
    var btn = qs('#pushEnableBtn', area); if(btn) btn.addEventListener('click', enableBirthdayPush);
  });
}

      '<div class="statSub" style="margin-bottom:10px">This date range is used for the &ldquo;time remaining&rdquo; calculation on each chemist&#39;s Sale For Sure 6 target in the Scheme Carnival tab.</div>'+
      '<div class="fieldRow">'+
        '<div class="field"><label class="lbl">Quarterly Incentive &mdash; Base Amount &#8377;/month</label><input type="number" id="fIncBase" value="'+(state.settings.incentiveBaseAmount||150000)+'" min="0"></div>'+
        '<div class="field"><label class="lbl">Quarterly Incentive &mdash; Rate %</label><input type="number" id="fIncRate" value="'+(state.settings.incentiveRate!=null?state.settings.incentiveRate:3)+'" min="0" step="0.1"></div>'+
      '</div>'+
      '<div class="statSub" style="margin-bottom:10px">Every quarter (3 months), the incentive is this Rate % on whatever primary is left after subtracting Base Amount &times; 3 &mdash; see the Quarterly Incentive card on the Primary &amp; Incentive tab.</div>'+
      '<button class="btn btn-primary" id="saveSettings">Save Settings</button>'+
    '</div>';

  qs('#exportBtn', c).addEventListener('click', function(){
    var data = {
      version:2, exportedAt:new Date().toISOString(),
      stockists: state.stockists, chemists: state.chemists,
      stock: state.stockByStockist, sales: state.salesByKey,
      primary: state.primaryByKey, weeklyReports: state.weeklyReports, finalOrders: state.finalOrders,
      manualOrderAdds: state.manualOrderAdds,
      pdc: state.pdc, settings: state.settings,
      partyReports: state.partyReports, partyCityOverrides: state.partyCityOverrides, partyMerges: state.partyMerges,
      cityMerges: state.cityMerges,
      productHistory: state.productHistory,
      incentiveAdjustments: state.incentiveAdjustments
    };
    var json = JSON.stringify(data, null, 2);
    var fname = 'beat-ledger-backup-'+todayYM()+'-'+pad2(new Date().getDate())+'.json';
    if(!downloads){ toast('Download feature is not available yet', true); return; }
    downloads.save({filename:fname, data:json})
      .then(function(){ toast('Backup downloaded'); })
      .catch(function(e){ if(e && e.code==='declined') return; toast(dbErrMsg(e,'Download failed'), true); });
  });

  qs('#importFile', c).addEventListener('change', function(){
    var file = this.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try{ data = JSON.parse(reader.result); }
      catch(e){ toast('File is not valid JSON', true); return; }
      restoreBackup(data);
    };
    reader.readAsText(file);
  });

  qs('#saveSettings', c).addEventListener('click', function(){
    var target = Number(qs('#fTarget', c).value)||4200000;
    var fyStartMonth = Number(qs('#fFyStart', c).value)||4;
    var targetCoverDays = Number(qs('#fCoverDays', c).value)||15;
    var safetyDays = Number(qs('#fSafetyDays', c).value)||0;
    var moqUnits = Number(qs('#fMoqUnits', c).value)||10;
    var companyName = qs('#fCompanyName', c).value.trim() || 'Smartway Wellness Pvt. Ltd.';
    var schemeStartDate = qs('#fSchemeStart', c).value || '2026-04-01';
    var schemeEndDate = qs('#fSchemeEnd', c).value || '2027-02-28';
    var incentiveBaseAmount = Number(qs('#fIncBase', c).value)||0;
    var incentiveRate = Number(qs('#fIncRate', c).value)||0;
    var payload = Object.assign({}, state.settings, {target:target, fyStartMonth:fyStartMonth, targetCoverDays:targetCoverDays, safetyDays:safetyDays, moqUnits:moqUnits, companyName:companyName, schemeStartDate:schemeStartDate, schemeEndDate:schemeEndDate, incentiveBaseAmount:incentiveBaseAmount, incentiveRate:incentiveRate});
    docSettings().set(payload).then(function(){ toast('Settings saved'); }).catch(function(e){ toast(dbErrMsg(e),true); });
  });
}
function restoreBackup(data){
  var jobs = [];
  (data.stockists||[]).forEach(function(s){ var id=s.id; var d=Object.assign({},s); delete d.id; jobs.push(colStockists().doc(id).set(d)); });
  (data.chemists||[]).forEach(function(ch){ var id=ch.id; var d=Object.assign({},ch); delete d.id; jobs.push(colChemists().doc(id).set(d)); });
  Object.keys(data.stock||{}).forEach(function(sid){ jobs.push(docStock(sid).set(data.stock[sid])); });
  Object.keys(data.sales||{}).forEach(function(key){ jobs.push(db.doc('sales/'+key).set(data.sales[key])); });
  Object.keys(data.primary||{}).forEach(function(key){ jobs.push(db.doc('primary/'+key).set(data.primary[key])); });
  Object.keys(data.weeklyReports||{}).forEach(function(key){ jobs.push(db.doc('weeklyReports/'+key).set(data.weeklyReports[key])); });
  Object.keys(data.finalOrders||{}).forEach(function(key){ jobs.push(db.doc('finalOrders/'+key).set(data.finalOrders[key])); });
  Object.keys(data.manualOrderAdds||{}).forEach(function(key){ jobs.push(db.doc('manualOrderAdds/'+key).set(data.manualOrderAdds[key])); });
  (data.pdc||[]).forEach(function(p){ var id=p.id; var d=Object.assign({},p); delete d.id; jobs.push(colPdc().doc(id).set(d)); });
  Object.keys(data.partyReports||{}).forEach(function(key){ jobs.push(db.doc('partyReports/'+key).set(data.partyReports[key])); });
  Object.keys(data.partyCityOverrides||{}).forEach(function(key){ jobs.push(db.doc('partyCityOverrides/'+key).set(data.partyCityOverrides[key])); });
  Object.keys(data.partyMerges||{}).forEach(function(key){ jobs.push(db.doc('partyMerges/'+key).set(data.partyMerges[key])); });
  Object.keys(data.cityMerges||{}).forEach(function(key){ jobs.push(db.doc('cityMerges/'+key).set(data.cityMerges[key])); });
  Object.keys(data.productHistory||{}).forEach(function(key){ jobs.push(db.doc('productHistory/'+key).set(data.productHistory[key])); });
  Object.keys(data.incentiveAdjustments||{}).forEach(function(key){ jobs.push(db.doc('incentiveAdjustments/'+key).set(data.incentiveAdjustments[key])); });
  if(data.settings) jobs.push(docSettings().set(data.settings));
  toast('Restoring '+jobs.length+' records…');
  Promise.all(jobs).then(function(){ toast('Restore complete'); }).catch(function(e){ toast(dbErrMsg(e,'Some records couldn\'t be restored'), true); });
}

window.__BeatLedger = { state: state };
init();
})();
</script>
