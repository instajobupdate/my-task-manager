<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat Ledger</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a56db">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beat Ledger">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    /* White + "trust blue" palette (Kapil, 2026-09) — plain white surfaces, a deep corporate
       blue as the one accent, and semantic colors (good/warning/critical) kept separate from
       that accent rather than reusing it. Sora/Inter restored for headings/body. */
    --paper:#f8fafc; --surface:#ffffff; --surface-2:#eef2f7;
    --ink:#1e293b; --ink-soft:#52607a; --muted:#94a3b8;
    --line:#e2e8f0; --line-soft:#f1f5f9;
    --brand:#1a56db; --brand-strong:#153e75; --brand-ink:#ffffff; --brand-soft:#e8f0fe;
    --brand-glow:rgba(26,86,219,.35);
    --brand-gradient:linear-gradient(135deg,#1a56db 0%,#164ec2 60%,#123e75 100%);
    --input-bg:#eff6ff; --input-border:#bfdbfe;
    --accent:#f5a623; --accent-soft:#fdecc9;
    --good:#16a34a; --warning:#c07a0a; --serious:#c1602f; --critical:#c62f2f;
    --series-1:#1a56db; --series-2:#f5a623;
    --shadow:0 1px 2px rgba(24,42,68,.07), 0 10px 26px rgba(24,42,68,.09);
    --radius-s:8px; --radius-m:14px; --radius-l:22px;
    /* Login-screen-only accent (2026-09-22, per Kapil's reference screenshot): a single warm
       red/coral hue, kept separate from --brand so the rest of the app stays trust-blue. */
    --auth-red:#dc2c46; --auth-red-dark:#a81530; --auth-red-ink:#ffffff;
    --auth-red-gradient:linear-gradient(135deg,#e6455c 0%,#dc2c46 55%,#a81530 100%);
    --auth-red-glow:rgba(220,44,70,.35);
    --auth-pink-soft:#fbe1e4; --auth-lavender-soft:#e7eafb;
    --auth-chip-bg:rgba(220,44,70,.09);
    --font-display:'Sora',system-ui,-apple-system,"Segoe UI",sans-serif; --font-body:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#161a22; --surface:#20252f; --surface-2:#2a3040;
      --ink:#eef1f6; --ink-soft:#b9c2d1; --muted:#7c8797;
      --line:#333b4b; --line-soft:#2a3040;
      --brand:#5b8def; --brand-strong:#1a56db; --brand-ink:#ffffff; --brand-soft:#1c2c4a;
      --brand-glow:rgba(91,141,239,.4);
      --brand-gradient:linear-gradient(135deg,#5b8def 0%,#3a6fe0 60%,#1a56db 100%);
      --input-bg:#1c2431; --input-border:#2e3f57;
      --accent:#f5a623; --accent-soft:#3a2a12;
      --good:#3fc23f; --warning:#e0a52e; --serious:#e2895e; --critical:#e2685f;
      --series-1:#5b8def; --series-2:#f5a623;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.5);
      --auth-red:#ff6b7f; --auth-red-dark:#c23350; --auth-red-ink:#ffffff;
      --auth-red-gradient:linear-gradient(135deg,#ff8a9a 0%,#ff6b7f 55%,#c23350 100%);
      --auth-red-glow:rgba(255,107,127,.4);
      --auth-pink-soft:#3a1620; --auth-lavender-soft:#1c2242;
      --auth-chip-bg:rgba(255,107,127,.14);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#161a22; --surface:#20252f; --surface-2:#2a3040;
    --ink:#eef1f6; --ink-soft:#b9c2d1; --muted:#7c8797;
    --line:#333b4b; --line-soft:#2a3040;
    --brand:#5b8def; --brand-strong:#1a56db; --brand-ink:#ffffff; --brand-soft:#1c2c4a;
    --brand-glow:rgba(91,141,239,.4);
    --brand-gradient:linear-gradient(135deg,#5b8def 0%,#3a6fe0 60%,#1a56db 100%);
    --input-bg:#1c2431; --input-border:#2e3f57;
    --accent:#f5a623; --accent-soft:#3a2a12;
    --good:#3fc23f; --warning:#e0a52e; --serious:#e2895e; --critical:#e2685f;
    --series-1:#5b8def; --series-2:#f5a623;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.5);
    --auth-red:#ff6b7f; --auth-red-dark:#c23350; --auth-red-ink:#ffffff;
    --auth-red-gradient:linear-gradient(135deg,#ff8a9a 0%,#ff6b7f 55%,#c23350 100%);
    --auth-red-glow:rgba(255,107,127,.4);
    --auth-pink-soft:#3a1620; --auth-lavender-soft:#1c2242;
    --auth-chip-bg:rgba(255,107,127,.14);
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
  h1,h2,h3,.display{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0}
  a{color:inherit}
  button,input,select,textarea{font:inherit;color:inherit}
  .tabular{font-variant-numeric:tabular-nums}
  .shell{display:flex;min-height:100vh}

  /* Sidebar — white panel + red header block, matching the reference app screens Kapil shared
     (2026-09): avatar circle + name up top on red, plain icon+label rows below on white. */
  .sidebar{width:250px;flex:none;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;padding:0;position:sticky;top:0;height:100vh;z-index:20;border-right:1px solid var(--line)}
  .sideHeader{background:linear-gradient(165deg,var(--brand),var(--brand-strong));padding:20px 16px 22px;position:relative;flex:none}
  .sideCloseBtn{display:none;all:unset;cursor:pointer;position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;align-items:center;justify-content:center;color:#fff;font-size:20px;line-height:1}
  .sideCloseBtn:hover{background:rgba(255,255,255,.18)}
  .brandmark{display:flex;align-items:center;gap:11px}
  .brandmark .mark{width:38px;height:38px;flex:none;border-radius:50%;background:#fff;color:var(--brand-strong);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:16px}
  .brandmark .name{font-family:var(--font-display);font-weight:700;font-size:15.5px;line-height:1.15;color:#fff}
  .brandmark .sub{font-size:11px;opacity:.85;letter-spacing:.02em;color:#fff;margin-top:3px}
  .navlist{list-style:none;margin:0;padding:10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
  .navlist button{all:unset;cursor:pointer;display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--ink-soft)}
  .navlist button:hover{background:var(--surface-2)}
  .navlist button.active{background:var(--brand);color:var(--brand-ink);opacity:1;font-weight:700}
  .navlist .ic{width:20px;text-align:center;flex:none;font-size:16.5px}
  .sidefoot{margin:8px 12px 14px;padding:13px 12px;border-radius:12px;background:var(--surface-2)}
  .sidefoot .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
  .sidefoot .val{font-family:var(--font-display);font-size:19px;font-weight:700;margin-bottom:6px;color:var(--brand-strong)}
  .miniTrack{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
  .miniTrack > i{display:block;height:100%;background:var(--brand)}

  /* Main */
  .mainWrap{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 26px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:8;flex-wrap:wrap}
  .topbar h1{font-size:22px;font-weight:700}
  .topbar .spacer{flex:1}
  .hamburger{display:none;all:unset;cursor:pointer;width:34px;height:34px;border-radius:8px;align-items:center;justify-content:center;border:1px solid var(--line)}
  .content{padding:26px;display:flex;flex-direction:column;gap:20px;max-width:1180px;width:100%;margin:0 auto}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(15,15,10,.4);z-index:15}
  .backdrop.show{display:block}

  @media (max-width:899px){
    .sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow)}
    .sidebar.open{transform:translateX(0)}
    .sideCloseBtn{display:flex}
    .hamburger{display:inline-flex}
    .content{padding:16px}
    .topbar{padding:12px 16px}
  }

  /* Building blocks */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:18px;box-shadow:var(--shadow)}
  .card h3{font-size:15px;margin-bottom:2px}
  .card .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:6px}
  .stat{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--brand)}
  .statSub{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
  .track{height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:10px}
  .track > i{display:block;height:100%;background:var(--brand);border-radius:6px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .row.between{justify-content:space-between}
  .sectionHead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
  .sectionHead h2{font-size:19px}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);box-shadow:0 1px 2px rgba(0,36,71,.07);cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap;text-decoration:none}
  .btn:hover{border-color:var(--brand)}
  .btn:active{background:var(--line-soft)}
  .btn-primary{background:var(--brand-gradient);border-color:transparent;border-radius:9999px;color:var(--brand-ink);box-shadow:0 2px 10px var(--brand-glow)}
  .btn-primary:hover{filter:brightness(1.05);border-color:transparent}
  .btn-primary:active{filter:brightness(.96)}
  .btn-primary.btn-sm{border-radius:9999px}
  .btn-ghost{background:transparent;border-color:transparent;box-shadow:none}
  .btn-ghost:hover{background:var(--surface-2);border-color:transparent}
  .btn-danger{color:var(--critical);border-color:var(--critical)}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  /* Rows/pills that respond to a tap but aren't a real <button> (city breakdown rows, order
     history rows, collapsible card headers) -- Kapil's feedback: these looked like plain,
     non-clickable text. cursor:pointer alone doesn't help on a touchscreen (no mouse hover),
     so give them a visible tap/active highlight instead. */
  .cityRow, [data-hist-toggle], .collapseHead{cursor:pointer}
  .cityRow:active td, [data-hist-toggle]:active, .collapseHead:active{background:var(--surface-2)}

  select, input[type=text], input[type=number], input[type=date], input[type=search], input[type=email], input[type=password], textarea{
    padding:9px 11px;border:1px solid var(--input-border);border-radius:12px;background:var(--input-bg);width:100%;
  }
  .authBox{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:0}
  .authBox .field{margin-bottom:0}
  input:focus, select:focus, textarea:focus, button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  label.lbl{font-size:12px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
  .field{display:flex;flex-direction:column;margin-bottom:13px}
  .fieldRow{display:flex;gap:10px;flex-wrap:wrap}
  .fieldRow > .field{flex:1;min-width:140px}

  .tableWrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface)}
  table{width:100%;border-collapse:collapse;min-width:520px}
  th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--surface-2);white-space:normal}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface-2)}
  tbody tr:active{background:var(--surface-2)}
  td.num, th.num{text-align:right;font-variant-numeric:tabular-nums}
  /* Make the identifying/first column and any amount column stand out at a glance — Kapil's
     feedback was that product/party names and numbers weren't "catching the eye" fast enough
     on a small screen; a plain-table layout is otherwise kept exactly as it was. */
  td:first-child{font-weight:600;color:var(--ink)}
  td.num{font-weight:700;color:var(--ink)}
  .searchBox{max-width:260px}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dot-good{background:var(--good)} .dot-warning{background:var(--warning)} .dot-serious{background:var(--serious)} .dot-critical{background:var(--critical)} .dot-muted{background:var(--muted)}

  .modalBackdrop{position:fixed;inset:0;background:rgba(15,15,10,.45);display:flex;align-items:flex-start;justify-content:center;z-index:60;padding:5vh 16px;overflow-y:auto}
  .modal{background:var(--surface);border-radius:var(--radius-l);max-width:600px;width:100%;padding:24px 24px 20px;box-shadow:var(--shadow)}
  .modal h3{font-size:18px;margin-bottom:16px}
  .modalFoot{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;border-top:1px solid var(--line);padding-top:14px}

  .lineItemRow{display:grid;grid-template-columns:1fr 90px 110px 32px;gap:8px;margin-bottom:8px;align-items:center}
  .lineItemRow.head{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
  .iconBtn{all:unset;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:var(--critical)}
  .iconBtn:hover{background:var(--surface-2)}

  .toastWrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:80}
  .toast{background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);max-width:320px}
  .toast.err{background:var(--critical);color:#fff}

  .empty{padding:36px 20px;text-align:center;color:var(--ink-soft)}
  .empty .big{font-size:28px;margin-bottom:8px}

  .subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .subtabs button{all:unset;cursor:pointer;padding:8px 16px;font-weight:600;font-size:13.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;transition:background .15s ease,color .15s ease,border-color .15s ease}
  .subtabs button:hover{background:var(--line-soft);color:var(--ink)}
  .subtabs button.active{color:var(--brand-ink);background:var(--brand);border-color:var(--brand)}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-top:8px}
  .legend .sw{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .chartTip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;border-radius:7px;transform:translate(-50%,-115%);white-space:nowrap;box-shadow:var(--shadow);opacity:0;transition:opacity .1s}
  .chartHost{position:relative}
  .barMark{cursor:pointer}

  .loadingScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--ink-soft);padding:24px;
    background:radial-gradient(circle at 10% 6%, var(--auth-pink-soft) 0%, transparent 46%),
               radial-gradient(circle at 90% 94%, var(--auth-lavender-soft) 0%, transparent 42%),
               var(--paper);
  }
  /* 2026-09-21, per Kapil: login page looked too plain next to distributor-app logins he'd seen
     (branded mark, icon-in-field inputs, welcoming subtitle) -- restyled as a proper card on the
     soft gradient backdrop above. */
  .authCard{width:100%;max-width:380px;background:var(--surface);border-radius:var(--radius-l);box-shadow:var(--shadow);padding:34px 30px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}
  /* 2026-09-22, per Kapil: matched to a reference distributor-app login he shared -- one warm
     red/coral accent (--auth-red*, kept local to the login screen only, not the app-wide --brand)
     used for the scattered background icons, the round mark, the input icon chips and the submit
     button, instead of the app's own trust-blue. Icons bigger/bolder and mixed filled+outline
     (see AUTH_BG_ICONS `fill` flag below) for the same richer, less-flat look as the reference. */
  .authBgIcons{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .authBgIcon{position:absolute;opacity:.34}
  .authBgIcon-brand{color:var(--auth-red)}
  .authBgIcon-accent{color:var(--auth-red-dark)}
  .authMark{width:56px;height:56px;border-radius:16px;background:var(--auth-red-gradient);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px var(--auth-red-glow);margin-bottom:14px;flex-shrink:0}
  .authMark svg{width:28px;height:28px;stroke:var(--auth-red-ink)}
  /* Beat Ledger brand mark (2026-09-25, Kapil's own icon design: navy notebook + green check) --
     this glyph carries its own background/colors, so the chip's red gradient/shadow is switched off. */
  .authMark.authMarkLogo{background:none;box-shadow:0 6px 18px rgba(4,57,140,.35);border-radius:14px;overflow:hidden}
  .authMark.authMarkLogo img{width:56px;height:56px;display:block;object-fit:cover}
  /* Beat Ledger wordmark (2026-09-25, take 2) -- text-only, no icon graphic, since the app isn't on
     a "beatledger" domain and Kapil wants the Beat Ledger name spelled out plainly here instead. */
  .authWordmark{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:14px}
  .authWordmark .line1{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.5px;color:var(--auth-red-dark)}
  .authWordmark .line2{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:3px;color:var(--ink)}
  .authWordmark .rule{width:34px;height:3px;border-radius:2px;background:var(--auth-red);margin-top:4px}
  .authTitle{font-size:21px;margin-bottom:4px;text-align:center}
  .authSubtitle{font-size:13px;color:var(--ink-soft);margin-bottom:22px;text-align:center}
  .inputIcon{position:relative}
  .inputIcon .iconChip{position:absolute;left:0;top:0;bottom:0;width:44px;display:flex;align-items:center;justify-content:center;background:var(--auth-chip-bg);border-radius:var(--radius-m) 0 0 var(--radius-m);pointer-events:none}
  .inputIcon .iconChip svg{width:16px;height:16px;stroke:var(--auth-red)}
  .inputIcon input{padding-left:56px}
  .inputIcon.hasToggle input{padding-right:38px}
  .pwToggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;padding:5px;cursor:pointer;color:var(--muted);display:flex;border-radius:6px}
  .pwToggle:hover{color:var(--ink-soft)}
  .authFootLink{background:none;border:none;color:var(--auth-red);font-size:13px;font-weight:600;cursor:pointer;padding:4px;text-align:center}
  .authFootLink:hover{text-decoration:underline}
  .authCard .btn-primary{background:var(--auth-red-gradient);color:var(--auth-red-ink);box-shadow:0 3px 14px var(--auth-red-glow);justify-content:center;font-size:14.5px;padding:10px 14px}

  /* 2026-09-22, per Kapil: tick a chemist as visited straight from the Chemist Visit Coverage
     list (rather than waiting on the next report re-upload) -- see chemistVisitRowKey /
     docChemistVisits().manualVisited. Visited rows stay in the list (so a mis-tap is easy to
     undo) but fade + strike through so the remaining pending ones stand out. */
  .cvTick{display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cvVisitedChk{width:18px;height:18px;cursor:pointer;accent-color:var(--good)}
  .cvRowVisited{opacity:.5}
  .cvRowVisited td:not(:first-child){text-decoration:line-through}

  @media (max-width:560px){
    .lineItemRow{grid-template-columns:1fr 68px 88px 28px}
    .cards{grid-template-columns:1fr 1fr}
  }
  @media (max-width:400px){ .cards{grid-template-columns:1fr} }

  /* Theme toggle button (topbar) */
  .themeToggleBtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
  .themeToggleBtn:hover{border-color:var(--brand)}
  .notifBell{position:relative;padding:7px 10px;font-size:16px;line-height:1}
  .notifBadge{position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--critical);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}

  /* ============================== MOBILE POLISH ==============================

   Rather than touching every one of the ~60 call sites across this file that use the
   Firestore-style API (db.collection()/doc()/.set()/.update()/.delete()/.onSnapshot(),
   snap.docs/snap.exists/snap.data()), this block re-implements that EXACT API surface on
   top of one generic Postgres table `documents` (collection, doc_id, data jsonb) — so
   everything below this block (colStockists(), docSettings(), subscribeAll(), etc.) works

function makeDb(){
  function buildDocSnap(id, row){
    return { id: id, exists: !!row, data: function(){ return row ? row.data : undefined; } };
  }
  function buildColSnap(rowsById){
    return { docs: Object.keys(rowsById).map(function(id){ return buildDocSnap(id, rowsById[id]); }) };
  }
  function docRef(collection, id){
    return {
      id: id,
      set: function(data){
        return supa.from('documents').upsert({collection:collection, doc_id:id, data:data||{}, updated_at:new Date().toISOString()}, {onConflict:'collection,doc_id'}).then(function(res){ if(res.error) throw res.error; return res; });
      },
      update: function(partial){
        return supa.from('documents').select('data').eq('collection',collection).eq('doc_id',id).maybeSingle().then(function(res){
          if(res.error) throw res.error;
          var merged = Object.assign({}, (res.data && res.data.data)||{}, partial||{});
          return supa.from('documents').upsert({collection:collection, doc_id:id, data:merged, updated_at:new Date().toISOString()}, {onConflict:'collection,doc_id'});
        }).then(function(res){ if(res.error) throw res.error; return res; });
      },
      delete: function(){
        return supa.from('documents').delete().eq('collection',collection).eq('doc_id',id).then(function(res){ if(res.error) throw res.error; return res; });
      },
      onSnapshot: function(cb, errCb){
        var row = null, live = true;
        function emit(){ if(live) cb(buildDocSnap(id, row)); }
        supa.from('documents').select('doc_id,data').eq('collection',collection).eq('doc_id',id).maybeSingle().then(function(res){
          if(res.error){ if(errCb) errCb(res.error); return; }
          row = res.data || null;
          emit();
          supa.channel('doc:'+collection+':'+id)
            .on('postgres_changes', {event:'*', schema:'public', table:'documents', filter:'collection=eq.'+collection+',doc_id=eq.'+id}, function(payload){
              if(payload.eventType==='DELETE'){ row = null; } else { row = payload.new; }
              emit();
            })
            .subscribe();
        });
        return function unsubscribe(){ live = false; };
      }
    };
  }
  function collectionRef(collection){
    return {
      doc: function(id){ return docRef(collection, id); },
      onSnapshot: function(cb, errCb){
        var rowsById = {}, live = true;
        function emit(){ if(live) cb(buildColSnap(rowsById)); }
        supa.from('documents').select('doc_id,data').eq('collection',collection).then(function(res){
          if(res.error){ if(errCb) errCb(res.error); return; }
          (res.data||[]).forEach(function(r){ rowsById[r.doc_id] = r; });
          emit();
          supa.channel('col:'+collection)
            .on('postgres_changes', {event:'*', schema:'public', table:'documents', filter:'collection=eq.'+collection}, function(payload){
              if(payload.eventType==='DELETE'){ delete rowsById[payload.old.doc_id]; } else { rowsById[payload.new.doc_id] = payload.new; }
              emit();
            })
            .subscribe();
        });
        return function unsubscribe(){ live = false; };
      }
    };
  }
  return {
    collection: collectionRef,
    doc: function(path){
      var i = path.indexOf('/');
      return docRef(path.slice(0,i), path.slice(i+1));
    }
  };
}

function makeDownloads(){

        try{

          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url; a.download = opts.filename || 'download';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
          resolve();
        }catch(e){ reject(e); }
      });
    }
  };
}

function pad2(n){ return (n<10?'0':'')+n; }
function ymKey(y,m){ return y+'-'+pad2(m); }
function ymParts(ym){ var p=ym.split('-'); return {y:+p[0], m:+p[1]}; }
function ymLabel(ym){ var p=ymParts(ym); return MONTH_NAMES[p.m-1]+' '+p.y; }

function fmtDMY(isoDate){ // 'YYYY-MM-DD' -> '01 Sep 2026'; passthrough if already formatted/blank
  if(!isoDate) return '';

  if(p.length!==3) return isoDate;

  if(mIdx<0 || mIdx>11) return isoDate;
  return pad2(+p[2])+' '+MONTH_NAMES[mIdx]+' '+p[0];

// (days-between-two-ISO-dates helper already exists further down as daysBetween(a,b) -- reused
// as-is for the Sale For Sure 6 scheme's "kitne din/mahine baaki hain" calc, below.)
// Friendly "X months Y days" label from a day count -- approximate (30-day months), good enough
// for a "how much time is left" display, not meant for exact calendar arithmetic.
function fmtDaysAsMonths(days){
  if(days<=0) return 'expired';
  var m = Math.floor(days/30), d = days%30;
  var parts=[];
  if(m>0) parts.push(m+(m>1?' months':' month'));
  if(d>0 || m===0) parts.push(d+(d>1?' days':' day'));
  return parts.join(' ');
}
function todayYM(){ var d=new Date(); return ymKey(d.getFullYear(), d.getMonth()+1); }
// List of ym strings from the current month through the month containing endISO (inclusive) --
// used by the Sale For Sure 6 scheme's monthly-pace graph, so the chart's month count matches
// the text's month count exactly (capped at 36 to guard against a bad/very-far settings date).
function monthsRemainingList(endISO){
  var cur = new Date();
  var y = cur.getFullYear(), m = cur.getMonth()+1;
  var endParts = (endISO||'').split('-');
  var endYM = endParts.length===3 ? (endParts[0]+'-'+endParts[1]) : ymKey(y,m);
  var months = [];
  var guard = 0;
  while(guard++ < 36){
    var ym = ymKey(y,m);
    months.push(ym);
    if(ym>=endYM) break;
    m++; if(m>12){ m=1; y++; }
  }
  return months;
}
// List of ym strings from startISO's month through the current month (inclusive) -- used to
// compute the Sale For Sure 6 scheme's "average monthly purchase so far" (purchased / count of
// elapsed months), same capped-at-36 pattern as monthsRemainingList.
function monthsElapsedList(startISO){
  var cur = new Date();
  var curYM = ymKey(cur.getFullYear(), cur.getMonth()+1);
  var startParts = (startISO||'').split('-');
  var y, m;
  if(startParts.length===3){ y=+startParts[0]; m=+startParts[1]; } else { y=cur.getFullYear(); m=cur.getMonth()+1; }
  var months = [];
  var guard = 0;
  while(guard++ < 36){
    var ym = ymKey(y,m);
    months.push(ym);
    if(ym>=curYM) break;
    m++; if(m>12){ m=1; y++; }
  }
  return months;
}
function prevYM(ym){ var p=ymParts(ym); var m=p.m-1, y=p.y; if(m<1){m=12;y--;} return ymKey(y,m); }

function fyLabel(startYear){ return startYear+'-'+String(startYear+1).slice(2); }
function fyMonths(startYear, fyStartMonth){
  fyStartMonth = fyStartMonth||4;

  for(var i=0;i<12;i++){

}
// Calendar-quarter helpers for the Primary tab's Quarterly Incentive card (added 2026-09-23).
// Deliberately calendar-quarter (Jan-Mar/Apr-Jun/Jul-Sep/Oct-Dec), NOT tied to fyStartMonth --
// since fyStartMonth is April in this app anyway the month groupings are identical either way,
// but keeping this independent avoids the incentive quarters silently shifting if fyStartMonth
// is ever changed in Settings for an unrelated reason (it drives the FY Target progress bar, not
// the company's incentive-quarter policy).
function quarterKeyOf(ym){
  var p = ymParts(ym);

function quarterMonthsOf(quarterKey){
  var parts = quarterKey.split('-Q'); var y = +parts[0], q = +parts[1];

  return [ymKey(y,startMonth), ymKey(y,startMonth+1), ymKey(y,startMonth+2)];
}
function quarterLabel(quarterKey){
  var months = quarterMonthsOf(quarterKey);

}
function fmtINR(n){
  n = Math.round(Number(n)||0);
  var neg = n<0; n=Math.abs(n);
  var s=String(n);
  var last3 = s.length>3 ? s.slice(-3) : s;
  var rest = s.length>3 ? s.slice(0,-3) : '';
  rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
  var out = rest ? rest+','+last3 : last3;
  return (neg?'-':'')+'₹'+out;
}
function fmtLakh(n){ return '₹'+((n||0)/100000).toFixed(2)+'L'; }
// Human "X Lakh" phrasing for a round-ish rupee figure (e.g. 200000 -> "2 Lakh", 240000 ->
// "2.4 Lakh") -- used only in the Sale For Sure 6 WhatsApp closing line (Kapil's own template,
// 2026-09) where a slab target of ₹1L+ reads better as "2 Lakh target" than the full digit
// string; smaller slab amounts (below ₹1L) fall back to the plain ₹ figure since "0.08 Lakh"
// reads worse than "₹8,000".
function targetPhraseLabel(amount){
  amount = Number(amount)||0;
  if(amount < 100000) return fmtINR(amount);
  var l = Math.round((amount/100000)*100)/100;
  return '₹'+(l % 1 === 0 ? l.toFixed(0) : String(l))+' Lakh';
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){

function uid(){ return 'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
// Splits a merged "Product Name + Pack" string (e.g. "RABENESS-DSR CAP 1*10CA") into its two
// parts for the Order List PDF's separate Pack column -- pops up to 2 trailing tokens that look
// like pack info (start with a digit, e.g. "1*10CA", "10TAB", "1.30GM", or a bare size token
// like "100ML" before a "1*10ML" box count) or a bare unit word ("JAR"), off the end of the
// string. Always leaves at least one token behind for the product name.
function splitProductPack(name){
  var toks = String(name==null?'':name).trim().split(/\s+/);
  var packToks = [];
  while(toks.length>1 && packToks.length<2 && (/^\d/.test(toks[toks.length-1]) || /^(JAR|TUBE|BOTTLE)$/i.test(toks[toks.length-1]))){

var _modalHistoryPushed = false; // true while the currently-open modal has its own history entry (see setupBackButtonHandling) -- so closeModal() knows whether to consume it
function openModal(title, bodyHtml, opts){
  opts = opts||{};
  var root = qs('#modalRoot');
  root.innerHTML =
    '<div class="modalBackdrop" id="mb">'+
      '<div class="modal" role="dialog" aria-modal="true">'+
        '<h3>'+esc(title)+'</h3>'+
        '<div id="modalBody">'+bodyHtml+'</div>'+
        '<div class="modalFoot">'+
          (opts.hideCancel ? '' : '<button class="btn" id="mCancel">Cancel</button>')+
          (opts.footerHtml!=null ? opts.footerHtml : '<button class="btn btn-primary" id="mSave">Save</button>')+
        '</div>'+
      '</div>'+
    '</div>';
  qs('#mb').addEventListener('mousedown', function(e){ if(e.target.id==='mb') closeModal(); });
  // NOTE: when opts.footerHtml also uses id="mCancel" (a single "close"-style button, e.g. the
  // Merge History modals), opts.hideCancel:true must be passed alongside it -- otherwise TWO
  // elements share id="mCancel" (this base button + the footerHtml one), and querySelector below
  // silently binds only to the FIRST one in the DOM, leaving the visible footerHtml button
  // (usually the highlighted primary one people actually click) completely dead. Bug Kapil hit
  // and reported, 2026-09: "Close" button did nothing.
  var cancelBtn = qs('#mCancel');
  if(cancelBtn) cancelBtn.addEventListener('click', closeModal);
  if(opts.onMount) opts.onMount(qs('#modalBody'));
  if(opts.onSave){
    var saveBtn = qs('#mSave');
    if(saveBtn) saveBtn.addEventListener('click', function(){ opts.onSave(qs('#modalBody'), saveBtn); });
  }
  // Give the modal its own Back-button stop (see setupBackButtonHandling) -- without this, the
  // phone's Back button while a modal is open would fall straight through to the tab history
  // (or, with no history at all previously, close the whole app) instead of just dismissing it.
  try{ history.pushState({modal:true, tab:state.tab}, '', location.href); _modalHistoryPushed = true; }catch(e){}
}
function closeModal(){
  qs('#modalRoot').innerHTML='';
  if(_modalHistoryPushed){
    _modalHistoryPushed = false;
    try{ history.back(); }catch(e){} // consume the history entry openModal() pushed, so Back doesn't later land on a stale "modal" entry
  }
}

/* ============================== PDF STOCK STATEMENT IMPORT ==============================
   In-app upload of a stockist's weekly/monthly stock & sales PDF (Stock tab). Parses the
   same fixed-column right-to-left token structure documented in the project notes:
   Product Name (+ Pack, merged) | LstSL | Open | Recd. | Sales | Close | Order | Pend | LstMove
   with an optional trailing marker: * = Near Expiry, # = Scheme On Product, *#/#* = both.
   Validated against a real 373-row Sanjivan report with 0 parse failures. */
var PDFJS_CDN_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
var _pdfjsLoadPromise = null;
function loadPdfJs(){
  if(_pdfjsLoadPromise) return _pdfjsLoadPromise;
  _pdfjsLoadPromise = new Promise(function(resolve, reject){
    if(window.pdfjsLib){ resolve(window.pdfjsLib); return; }
    var s = document.createElement('script');
    s.src = PDFJS_CDN_BASE + 'pdf.min.js';
    s.onload = function(){
      try{
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_CDN_BASE + 'pdf.worker.min.js';
        resolve(window.pdfjsLib);
      }catch(e){ reject(e); }
    };
    s.onerror = function(){ reject(new Error('PDF reader failed to load — please check your internet.')); };
    document.head.appendChild(s);
  });
  return _pdfjsLoadPromise;
}
function extractPdfLines(file){
  return loadPdfJs().then(function(pdfjsLib){
    return file.arrayBuffer().then(function(buf){
      return pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
    });
  }).then(function(pdf){
    var pageNums=[]; for(var i=1;i<=pdf.numPages;i++) pageNums.push(i);
    return pageNums.reduce(function(chain, pageNum){
      return chain.then(function(acc){
        return pdf.getPage(pageNum).then(function(page){
          return page.getTextContent().then(function(content){
            var rows={};
            content.items.forEach(function(item){
              var y = Math.round(item.transform[5]*2)/2; // tolerate tiny sub-pixel jitter
              (rows[y] = rows[y]||[]).push({x:item.transform[4], str:item.str});
            });
            var ys = Object.keys(rows).map(Number).sort(function(a,b){return b-a;}); // top-to-bottom
            ys.forEach(function(y){
              var items = rows[y].sort(function(a,b){return a.x-b.x;}); // left-to-right
              var line = items.map(function(it){return it.str;}).join(' ').replace(/\s+/g,' ').trim();
              if(line) acc.push(line);
            });
            return acc;
          });
        });
      });
    }, Promise.resolve([]));
  });
}
function parseStockStatementLine(line){
  line = line.trim();
  if(!line) return null;
  var tokens = line.split(/\s+/);
  if(tokens.length < 9) return null;
  var base = tokens.slice();
  var marker = '';
  if(/^[*#]+$/.test(base[base.length-1])) marker = base.pop();
  if(!base.length) return null;
  function num(x){ return x==='-' ? 0 : parseFloat(x.replace(/,/g,'')); }
  var numRe = /^-?[\d,]+(\.\d+)?$|^-$/;
  // Tries to read t as: Product(+Pack) | 7 numeric fields | LstMove (date, or blank "/ /").
  function tryParse(t){
    t = t.slice();
    var lastMove = null;
    if(t.length && /^\d{2}\/\d{2}\/\d{2}$/.test(t[t.length-1])){ lastMove = t.pop(); }
    else if(t.length>=2 && t[t.length-1]==='/' && t[t.length-2]==='/'){ t.pop(); t.pop(); lastMove=null; }
    else return null;
    if(t.length < 7) return null;
    var tail7 = t.slice(t.length-7);
    if(!tail7.every(function(x){ return numRe.test(x); })) return null;
    var rest = t.slice(0, t.length-7);
    if(!rest.length) return null;
    return {
      product: rest.join(' '),
      lastMonthSale: num(tail7[0]), openStock: num(tail7[1]), received: num(tail7[2]),
      sale: num(tail7[3]), closeStock: num(tail7[4]), order: num(tail7[5]), pending: num(tail7[6]),
      nearExpiry: marker.indexOf('*')!==-1, scheme: marker.indexOf('#')!==-1,
      lastMoveDate: lastMove
    };
  }
  // Some report exports (seen in a 2026-09-19 Sanjivan re-export) print an extra Stk.Value column
  // AFTER LstMove: Product Name Pack LstSL Open Recd. Sales Close Order Pend LstMove Stk.Value.
  // Try popping that trailing column first; fall back to the original layout (no Stk.Value, the
  // format this parser was first validated against) so older/other-stockist exports keep working.
  if(base.length > 1){
    var withStkValue = tryParse(base.slice(0, base.length-1));
    if(withStkValue) return withStkValue;
  }
  return tryParse(base);
}
// ---- Header-driven parsing: adapts to a stockist's report gaining/losing/reordering a TRAILING
// column (after the 7 fixed core quantity columns LstSL/Open/Recd/Sales/Close/Order/Pend) without
// needing a code fix each time -- this is exactly the shape of bug fixed 2026-09-19 (a report started
// printing an extra "Stk.Value" column after LstMove). Reads the report's own printed header row
// ("Product Name Pack LstSL Open Recd. Sales Close Order Pend LstMove Stk.Value") to discover which
// columns come after "Pend" and in what order, instead of hardcoding them. It does NOT adapt to the
// 7 core columns themselves changing name/order/count -- that's a genuinely different report layout
// and still needs a one-off manual look (see the "format looks different" fallback message).
function normColHeader(s){ return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,''); }
function deriveStockHeaderTailSchema(headerLine){
  var toks = headerLine.trim().split(/\s+/);
  var norm = toks.map(normColHeader);
  var pendIdx = norm.lastIndexOf('pend');
  if(pendIdx===-1 || norm.indexOf('lstsl')===-1) return null;
  return toks.slice(pendIdx+1).map(function(name){
    var n = normColHeader(name);
    return { name: name, kind: (n.indexOf('move')!==-1 || n.indexOf('date')!==-1) ? 'date' : 'number' };
  });
}
function parseStockStatementLineWithSchema(line, tailSchema){
  line = line.trim();
  if(!line) return null;
  var tokens = line.split(/\s+/);
  if(tokens.length < 8 + tailSchema.length) return null; // product(>=1) + 7 core + N trailing columns
  var t = tokens.slice();
  var marker = '';
  if(/^[*#]+$/.test(t[t.length-1])) marker = t.pop();
  if(!t.length) return null;
  var numRe = /^-?[\d,]+(\.\d+)?$|^-$/;
  var lastMove = null;
  for(var i=tailSchema.length-1; i>=0; i--){
    var col = tailSchema[i];
    if(col.kind==='date'){
      if(t.length && /^\d{2}\/\d{2}\/\d{2}$/.test(t[t.length-1])){ lastMove = t.pop(); }
      else if(t.length>=2 && t[t.length-1]==='/' && t[t.length-2]==='/'){ t.pop(); t.pop(); }
      else return null;
    } else {
      if(!t.length || !/^-?[\d,]+(\.\d+)?$/.test(t[t.length-1])) return null;
      t.pop(); // trailing numeric column (e.g. Stk.Value) -- not used downstream, just consumed
    }
  }
  if(t.length < 7) return null;
  var tail7 = t.slice(t.length-7);
  if(!tail7.every(function(x){ return numRe.test(x); })) return null;
  var rest = t.slice(0, t.length-7);
  if(!rest.length) return null;
  function num(x){ return x==='-' ? 0 : parseFloat(x.replace(/,/g,'')); }
  return {
    product: rest.join(' '),
    lastMonthSale: num(tail7[0]), openStock: num(tail7[1]), received: num(tail7[2]),
    sale: num(tail7[3]), closeStock: num(tail7[4]), order: num(tail7[5]), pending: num(tail7[6]),
    nearExpiry: marker.indexOf('*')!==-1, scheme: marker.indexOf('#')!==-1,
    lastMoveDate: lastMove
  };
}
function parseStockStatementPdf(lines){
  var rows=[], skipped=[];
  // Find this report's own printed header row and derive its trailing-column layout from it.
  var tailSchema = null;
  for(var i=0;i<lines.length;i++){
    var norm = lines[i].trim().split(/\s+/).map(normColHeader);
    if(norm.indexOf('product')!==-1 && norm.indexOf('lstsl')!==-1){
      tailSchema = deriveStockHeaderTailSchema(lines[i]);
      if(tailSchema) break;
    }
  }
  lines.forEach(function(line){
    var s = line.trim(); if(!s) return;
    var r = tailSchema ? parseStockStatementLineWithSchema(line, tailSchema) : null;
    if(r===null) r = parseStockStatementLine(line); // fixed-layout fallback (also covers "no header found")
    if(r===null) skipped.push(s); else rows.push(r);
  });
  return {rows:rows, skipped:skipped};
}
// ---- Statement summary/footer line -- e.g. "Last Month Sales 1,44,034.03 Open. Value 3,34,690.85
// / Receipt Value 1,43,044.16 Sales Value 85,454.90 / Closing Value 4,11,371.94 [Order Value
// +1886.98 -370531.47][Pend.Value 177.42]" -- printed once per PDF (usually near the top), separate
// from the per-product rows above. Added 2026-09-20 per Kapil: he wants these stockist-level totals
// visible on the Stockists tab after each upload. All lines are joined into one string before
// matching since a report can print this across 2-3 separate y-position lines; each label is
// matched independently so a missing/reworded field just comes back null instead of breaking the
// rest. Returns null (nothing to show) only if NONE of the labels were found at all.
function parseStockStatementSummary(lines){
  var text = (lines||[]).join(' ').replace(/\s+/g,' ');
  function num(s){ return s==null ? null : parseFloat(String(s).replace(/,/g,'')); }
  function grab(re){ var m = text.match(re); return m ? num(m[1]) : null; }
  var summary = {
    lastMonthSales: grab(/Last Month Sales\s+(-?[\d,]+\.?\d*)/i),
    openValue: grab(/Open\.?\s*Value\s+(-?[\d,]+\.?\d*)/i),
    receiptValue: grab(/Receipt Value\s+(-?[\d,]+\.?\d*)/i),
    salesValue: grab(/Sales Value\s+(-?[\d,]+\.?\d*)/i),
    closingValue: grab(/Closing Value\s+(-?[\d,]+\.?\d*)/i),
    pendValue: grab(/Pend\.?\s*Value\s+(-?[\d,]+\.?\d*)/i)
  };
  var orderMatch = text.match(/Order Value\s+([+-]?[\d,]+\.?\d*)\s+([+-]?[\d,]+\.?\d*)/i);
  summary.orderValue = orderMatch ? num(orderMatch[1]) : null;
  summary.orderValueExtra = orderMatch ? num(orderMatch[2]) : null;
  var hasAny = Object.keys(summary).some(function(k){ return summary[k]!=null; });
  return hasAny ? summary : null;
}

/* ============================== CHEMIST VISITS IMPORT (XLSX) ==============================
   In-app upload of the MR-tracking software's "Chemist Visits" report (Scheme Carnival tab,
   "Chemist Visit Coverage" card) -- an Excel export (not a PDF, unlike the reports above) with a
   fixed header row: Sr.No | Chemist Name | Contact | City | Area | Mobile | Days | Frequency.
   "Frequency" is how many visits that chemist has logged in the export's period -- 0 means not
   yet visited, which is the whole point of this list (so Kapil can see, area by area, which
   chemists in his beat still need covering this month). Parsed client-side with SheetJS (loaded
   from CDN on demand, same lazy-load pattern as pdf.js/jsPDF above) since it's a real spreadsheet,
   not text to scrape. */
var XLSXJS_CDN_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
var _xlsxLoadPromise = null;
function loadXlsxJs(){
  if(_xlsxLoadPromise) return _xlsxLoadPromise;
  _xlsxLoadPromise = new Promise(function(resolve, reject){
    if(window.XLSX){ resolve(window.XLSX); return; }
    var s = document.createElement('script');
    s.src = XLSXJS_CDN_URL;
    s.onload = function(){ if(window.XLSX) resolve(window.XLSX); else reject(new Error('Spreadsheet reader failed to load.')); };
    s.onerror = function(){ reject(new Error('Spreadsheet reader failed to load — please check your internet.')); };
    document.head.appendChild(s);
  });
  return _xlsxLoadPromise;
}
// Header names are matched loosely (lowercased, punctuation/spaces stripped) since re-exports of
// this report have shown up with slightly different casing/spacing in the past (other PDF imports
// in this file hit the same issue) -- e.g. "Chemist Name" / "chemistname" both match.
function normHeader(s){ return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,''); }
var CHEMIST_VISITS_HEADER_MAP = {
  chemistname:'name', name:'name',
  contact:'contact', contactperson:'contact',
  city:'city',
  area:'area',
  mobile:'mobile', mobileno:'mobile',
  days:'days',
  frequency:'frequency', freq:'frequency'
};
function parseChemistVisitsWorkbook(file){
  return loadXlsxJs().then(function(XLSX){
    return file.arrayBuffer().then(function(buf){
      var wb = XLSX.read(new Uint8Array(buf), {type:'array'});
      var sheet = wb.Sheets[wb.SheetNames[0]];
      var grid = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', blankrows:false});
      if(!grid.length) return {rows:[], skipped:0};
      var headerRow = grid[0].map(normHeader);
      var colFor = {}; // field -> column index
      headerRow.forEach(function(h, i){ var field = CHEMIST_VISITS_HEADER_MAP[h]; if(field && colFor[field]===undefined) colFor[field]=i; });
      if(colFor.name===undefined || colFor.area===undefined){
        return {rows:[], skipped:grid.length-1, headerError:true};
      }
      var rows=[], skipped=0;
      for(var r=1; r<grid.length; r++){
        var row = grid[r];
        var name = String(row[colFor.name]==null?'':row[colFor.name]).trim();
        if(!name){ skipped++; continue; }
        rows.push({
          name: name,
          contact: colFor.contact!==undefined ? String(row[colFor.contact]==null?'':row[colFor.contact]).trim() : '',
          city: colFor.city!==undefined ? String(row[colFor.city]==null?'':row[colFor.city]).trim() : '',
          area: colFor.area!==undefined ? String(row[colFor.area]==null?'':row[colFor.area]).trim() : 'Unknown',
          mobile: colFor.mobile!==undefined ? String(row[colFor.mobile]==null?'':row[colFor.mobile]).trim() : '',
          days: colFor.days!==undefined ? String(row[colFor.days]==null?'':row[colFor.days]).trim() : '',
          frequency: colFor.frequency!==undefined ? (Number(row[colFor.frequency])||0) : 0
        });
      }
      return {rows:rows, skipped:skipped};
    });
  });
}
// Chemist Roster (name + area + DOB) bulk upload -- added 2026-09-25 per Kapil: most of the
// Top-70 list was never entered one-by-one via "+ Add Chemist", so Birthdays/Scheme Carnival only
// ever showed the handful that were. Kapil sends an Excel with chemist name + DOB (area optional);
// DOBs won't all be accurate so this only ever ADDS/UPDATES -- it never deletes -- and the
// Birthdays tab's Upcoming table got an inline edit (see renderBirthdays) so a wrong one can be
// corrected any time, not just by re-uploading the whole sheet.
var CHEMIST_ROSTER_HEADER_MAP = {
  chemistname:'name', name:'name', medicalname:'name', medical:'name',
  area:'area', city:'area', location:'area',
  dob:'dob', dateofbirth:'dob', birthday:'dob', bday:'dob', birthdate:'dob'
};
// Excel serial date (1900 date system) -> 'YYYY-MM-DD'. 25569 = days between the Excel epoch
// (1899-12-30) and the Unix epoch (1970-01-01); the standard conversion used by every xlsx-reading
// tool that doesn't pass {cellDates:true} to SheetJS (this file doesn't, elsewhere either).
function excelSerialToISODate(serial){
  var utcDays = Math.floor(serial - 25569);
  var d = new Date(utcDays * 86400 * 1000);
  return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate());
}
// Accepts a DOB cell in whatever shape Kapil's sheet has it: an Excel date-formatted cell (arrives
// as a numeric serial), or typed text as dd-mm-yyyy / dd/mm/yyyy / dd.mm.yyyy / yyyy-mm-dd. Returns
// '' (not an error) for anything it can't confidently parse -- the row still gets saved, just
// without a birthday, rather than blocking the whole import.
function parseDobCell(val){
  if(val===null || val===undefined || val==='') return '';
  if(typeof val==='number' && isFinite(val)){
    return (val>0 && val<2958466) ? excelSerialToISODate(val) : ''; // sane Excel date-serial range (year 1..9999)
  }
  var s = String(val).trim();
  if(!s) return '';
  var m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/); // yyyy-mm-dd / yyyy/mm/dd
  if(m){
    var y1=+m[1], mo1=+m[2], d1=+m[3];
    if(mo1>=1&&mo1<=12&&d1>=1&&d1<=31) return y1+'-'+pad2(mo1)+'-'+pad2(d1);
    return '';
  }
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/); // dd-mm-yyyy / dd/mm/yyyy / dd.mm.yyyy
  if(m){
    var d2=+m[1], mo2=+m[2], y2=+m[3];
    if(y2<100) y2 += (y2<50?2000:1900);
    if(mo2>12 && d2<=12){ var t=d2; d2=mo2; mo2=t; } // looked like mm-dd-yyyy instead -- swap
    if(mo2>=1&&mo2<=12&&d2>=1&&d2<=31) return y2+'-'+pad2(mo2)+'-'+pad2(d2);
  }
  return '';
}
function parseChemistRosterWorkbook(file){
  return loadXlsxJs().then(function(XLSX){
    return file.arrayBuffer().then(function(buf){
      var wb = XLSX.read(new Uint8Array(buf), {type:'array'});
      var sheet = wb.Sheets[wb.SheetNames[0]];
      var grid = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', blankrows:false});
      if(!grid.length) return {rows:[], skipped:0, unreadableDob:0};
      var headerRow = grid[0].map(normHeader);
      var colFor = {};
      headerRow.forEach(function(h, i){ var field = CHEMIST_ROSTER_HEADER_MAP[h]; if(field && colFor[field]===undefined) colFor[field]=i; });
      if(colFor.name===undefined){
        return {rows:[], skipped:grid.length-1, unreadableDob:0, headerError:true};
      }
      var rows=[], skipped=0, unreadableDob=0;
      for(var r=1; r<grid.length; r++){
        var row = grid[r];
        var name = String(row[colFor.name]==null?'':row[colFor.name]).trim();
        if(!name){ skipped++; continue; }
        var rawDob = colFor.dob!==undefined ? row[colFor.dob] : '';
        var dob = parseDobCell(rawDob);
        var hadDobText = rawDob!==null && rawDob!==undefined && String(rawDob).trim()!=='';
        if(hadDobText && !dob) unreadableDob++;
        rows.push({
          name: name,
          area: colFor.area!==undefined ? String(row[colFor.area]==null?'':row[colFor.area]).trim() : '',
          dob: dob,
          dobUnreadable: hadDobText && !dob
        });
      }
      return {rows:rows, skipped:skipped, unreadableDob:unreadableDob};
    });
  });
}
// Stable key for a chemist row within a Chemist Visits upload, used to remember a manual
// "visited" tick between uploads (the report has no chemist id, just name+area) -- see
// chemistVisitsZeroByArea and the checkbox wiring in wireChemistVisitCoverage below.
function chemistVisitRowKey(r){ return (r.area||'Unknown')+'||'+(r.name||'').trim().toLowerCase(); }
// Groups the latest upload's zero-visit chemists by Area for display -- see openChemistVisitsUploadModal
// (upload/save) and renderChemists' "Chemist Visit Coverage" card (display) below. Each row also
// carries `visited`/`key`: Kapil, 2026-09-22, wants to tick a chemist off here the moment he
// actually visits them, rather than wait for the next Chemist Visits report re-upload to catch
// up -- see docChemistVisits().manualVisited (an {rowKey: ISOString} map, separate from the
// uploaded report data itself, reset on every fresh re-upload).
function chemistVisitsZeroByArea(){
  var snap = state.chemistVisits;
  if(!snap || !snap.rows || !snap.rows.length) return {areas:[], totalZero:0, totalAll:0, totalPending:0};
  var manual = snap.manualVisited || {};
  var totalAll = snap.rows.length;
  var zero = snap.rows.filter(function(r){ return Number(r.frequency)===0; });
  // 2026-09-27, per Kapil: this area-wise grouping should follow the same city merges he's already
  // made on the Party Sales tab (e.g. a "CHANDRAPUR LOCAL" spelling folded into "CHANDRAPUR") instead
  // of treating every distinct area spelling in the Chemist Visits report as its own area. Reuses the
  // exact same merge map + resolver Party Sales uses (cityMergeMapFromState / resolveCityDisplay) so
  // one merge, made anywhere, applies everywhere area/city text is grouped.
  var cm = cityMergeMapFromState();
  var byArea = {};
  zero.forEach(function(r){
    var key = resolveCityDisplay(r.area||'Unknown', cm) || 'Unknown';
    (byArea[key] = byArea[key]||[]).push(r);
  });
  var totalPending = 0;
  var areas = Object.keys(byArea).sort(function(a,b){ return a.localeCompare(b); }).map(function(area){
    var list = byArea[area].slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).map(function(r){
      var key = chemistVisitRowKey(r);
      var visited = !!manual[key];
      if(!visited) totalPending++;
      return Object.assign({}, r, {key:key, visited:visited});
    });
    var pending = list.filter(function(r){ return !r.visited; }).length;
    return {area:area, rows:list, pending:pending};
  });
  return {areas:areas, totalZero:zero.length, totalAll:totalAll, totalPending:totalPending};
}

/* ============================== PDF PARTY-WISE SALES REPORT IMPORT ==============================
   In-app upload of a stockist's "Company-wise Customer-wise Sale" PDF (Party Sales tab) — a
   ledger of every party/medical the stockist sold to over a date range, with a total ₹ amount
   per party. Unlike the stock statement (line-based, right-to-left token popping), this report
   needs the Party Name split from its City/Address, which can't be done reliably by whitespace
   alone (both are multi-word and variable length) — so this parser keeps each word's x-position
   (from pdf.js's item.transform[4]) instead of joining lines into plain text, and splits Name
   from City by a fixed column boundary. Verified against two real reports (Sanjivan 357 rows,
   Medbricks 284 rows): every row recovered, parsed sum exactly equal to the PDF's own printed
   "Total :" line in both cases. Row shape: {serno, code, name, city, amount}. */
function extractPdfRowsWithWords(file){
  return loadPdfJs().then(function(pdfjsLib){
    return file.arrayBuffer().then(function(buf){
      return pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
    });
  }).then(function(pdf){
    var pageNums=[]; for(var i=1;i<=pdf.numPages;i++) pageNums.push(i);
    return pageNums.reduce(function(chain, pageNum){
      return chain.then(function(acc){
        return pdf.getPage(pageNum).then(function(page){
          return page.getTextContent().then(function(content){
            var rows={};
            content.items.forEach(function(item){
              var y = Math.round(item.transform[5]*2)/2; // tolerate tiny sub-pixel jitter
              (rows[y] = rows[y]||[]).push({x:item.transform[4], str:item.str});
            });
            var ys = Object.keys(rows).map(Number).sort(function(a,b){return b-a;}); // top-to-bottom
            ys.forEach(function(y){
              var words = rows[y].filter(function(w){ return w.str && w.str.trim(); }).sort(function(a,b){return a.x-b.x;});
              if(!words.length) return;
              var text = words.map(function(w){return w.str;}).join(' ').replace(/\s+/g,' ').trim();
              acc.push({text:text, words:words});
            });
            return acc;
          });
        });
      });
    }, Promise.resolve([]));
  });
}
// Items (pdf.js text runs, NOT individual words — see below) with x >= this belong to the
// "City/Address" part of the "Customer Name & Address" column; below it, to the "Name" part.
// Calibrated against real Sanjivan+Medbricks party-wise sale PDFs — Name column starts
// ~x116pt, City/Address column starts ~x302pt. Re-check this if a differently-formatted
// stockist report is ever uploaded (the <5-rows-parsed warning below will flag a mismatch).
var PARTY_LEDGER_CITY_X = 290;
// IMPORTANT: unlike a per-word text-grid, pdf.js's getTextContent() gives one item per
// underlying PDF text-show command, and this report's generator doesn't always start a new
// one at each column — sometimes "SerNo Code Name" is one item and City is a separate item
// (the common case), but sometimes the whole "SerNo Code Name City" is ONE item with no
// column break at all (seen on ~10% of rows in both real files, whenever a name is short
// enough not to force an early line-wrap). So this can't assume a fixed item-per-row count —
// it classifies every item between the first and last by x-position (first item's own text is
// always < PARTY_LEDGER_CITY_X, so its leftover tokens after SerNo+Code go to "name"), then,
// for the rows where NO item ever reached the City column (name swallowed the city with no x
// signal to split on), corrects them in a second pass by matching the tail of that merged text
// against the vocabulary of city names already seen elsewhere in the same document (falling
// back to "last word only" if no match). Verified against two real reports (Sanjivan 357 rows,
// Medbricks 284 rows): every row recovered, parsed sum exactly equal to the PDF's own printed
// "Total :" line in both cases. Row shape: {serno, code, name, city, amount}.
function parsePartyLedgerRowRaw(items){
  if(items.length < 2) return null;
  var first = items[0], last = items[items.length-1];
  var m = /^(-?[\d,]+\.\d{2})/.exec(last.str);
  if(!m) return null;
  var amount = parseFloat(m[1].replace(/,/g,''));
  var firstToks = first.str.trim().split(/\s+/);
  if(firstToks.length < 2 || !/^\d+$/.test(firstToks[0])) return null;
  var serno = parseInt(firstToks[0],10);
  var code = firstToks[1];
  var nameParts = firstToks.length>2 ? [firstToks.slice(2).join(' ')] : [];
  var cityParts = [];
  items.slice(1, items.length-1).forEach(function(it){
    if(it.x < PARTY_LEDGER_CITY_X) nameParts.push(it.str); else cityParts.push(it.str);
  });
  var name = nameParts.join(' ').trim();
  var city = cityParts.join(' ').trim();
  if(!name && !city) return null;
  return {serno:serno, code:code, name:name, city:city, amount:amount, hadCityItem:cityParts.length>0};
}
function parsePartyReportDate(s){ // "DD/MM/YYYY" -> "YYYY-MM-DD"
  var p = s.split('/'); if(p.length!==3) return null;
  return p[2]+'-'+p[1]+'-'+p[0];
}
function parsePartyLedgerPdf(file){
  return extractPdfRowsWithWords(file).then(function(rows){
    var fromDate=null, toDate=null, printedTotal=null;
    rows.forEach(function(r){
      if(fromDate==null){
        var fm = /From\s*:\s*(\d{2}\/\d{2}\/\d{4})\s*To\s*:\s*(\d{2}\/\d{2}\/\d{4})/.exec(r.text);
        if(fm){ fromDate = parsePartyReportDate(fm[1]); toDate = parsePartyReportDate(fm[2]); }
      }
      var tm = /^Total\s*:?\s*([\d,]+\.\d{2})/.exec(r.text);
      if(tm){ printedTotal = parseFloat(tm[1].replace(/,/g,'')); }
    });
    var raw=[], skipped=0;
    rows.forEach(function(r){
      if(!r.words.length || !/^\d+(\s|$)/.test(r.words[0].str)) return; // not a numbered data row (header/footer/dashes) — ignore silently
      var row = parsePartyLedgerRowRaw(r.words);
      if(row) raw.push(row); else skipped++;
    });
    // Second pass: vocabulary correction for rows where the city never got its own item.
    var knownCities = {};
    raw.forEach(function(r){ if(r.hadCityItem && r.city) knownCities[r.city]=true; });
    var parsed = raw.map(function(r){
      if(r.hadCityItem || !r.name) return {serno:r.serno,code:r.code,name:r.name,city:r.city,amount:r.amount};
      var toks = r.name.split(/\s+/);
      var city=null, splitAt=toks.length;
      for(var k=Math.min(4, toks.length-1); k>=1; k--){
        var suffix = toks.slice(toks.length-k).join(' ');
        if(knownCities[suffix]){ city=suffix; splitAt=toks.length-k; break; }
      }
      if(city==null){ city = toks[toks.length-1]; splitAt = toks.length-1; }
      return {serno:r.serno, code:r.code, name:toks.slice(0,splitAt).join(' ')||r.name, city:city, amount:r.amount};
    });
    parsed.sort(function(a,b){ return a.serno-b.serno; });
    var totalAmount=0; parsed.forEach(function(r){ totalAmount += r.amount; });
    return {rows:parsed, fromDate:fromDate, toDate:toDate, printedTotal:printedTotal, totalAmount:totalAmount, skippedLines:skipped};
  });
}

/* ============================== PDF PRODUCT-WISE SALES REPORT IMPORT ==============================
   In-app upload of a stockist's "Customer-Wise Product-Wise Sales" PDF -- unlike the Party Sales
   report above (amount per party only), this one lists every product each party bought, so Kapil
   can look up "ye party normally kya leta hai" while standing in the shop and propose that order
   directly (Party Sales tab, "Products" button per row). Line-based right-to-left token popping
   (same style as the Stock Statement parser) since the columns are fixed: ProductCode ProductName
   Pack | INV/DM InvNo Date | BatchNo | Qty | Free | Rate | Value | [Prod.Dis -- Medbricks only].
   Qty/Free/Prod.Dis are all printed BLANK (not "0") when zero, on both stockists' PDFs -- so the
   decimal-column count can't be fixed per report (a Medbricks row can have 2 or 3 trailing decimal
   tokens depending on whether that row's own Prod.Dis happened to be zero) -- instead the trailing
   decimals are popped greedily (up to 3) off the end of the line, and however many integer tokens
   are left after that are Free-then-Qty (2 present) or just Qty (1 present, Free=0). The same
   product+pack can appear on several separate lines per customer (different invoices/batches/
   dates, not pre-aggregated in the PDF) -- these get summed into one row per customer with an
   "orders" count (= number of separate purchase lines, a proxy for how often that party re-orders
   it) and the most recent date. Verified against both real reports (Sanjivan: Aug'26 only, 1
   month, 42 pages; Medbricks: Apr-Aug'26, 5 months, 101 pages) -- every customer's own printed
   "Total:" line matches the sum of its parsed line items, and (Sanjivan only -- Medbricks' PDF
   doesn't print one) the report's own grand "Total Value :" line matches the sum of all customers.
   NOTE the two stockists' PDFs cover very different date ranges -- the "orders"/qty numbers are
   only meaningfully comparable within the same stockist, not across the two. */
function parseProductReportDate(s){ // "DD/MM/YYYY" or "DD/MM/YY" -> "YYYY-MM-DD"
  var p = (s||'').split('/'); if(p.length!==3) return null;
  var y = p[2];
  if(y.length===2) y = '20'+y;
  return y+'-'+p[1]+'-'+p[0];
}
function parseProductWiseSalesLine(line){
  var toks = line.trim().split(/\s+/);
  if(toks.length < 7) return null;
  // Locate the INV/DM marker column by STRUCTURE, not by matching its literal text ("INV"/"DM"
  // covers the common case, but the real data also has at least one "IND" row -- some other
  // document-type code from the stockist's own software) -- the marker is whichever token is
  // immediately followed by an invoice-number (digits) then a date (dd/mm/yy[yy]); everything
  // before it is ProductCode+Name+Pack, everything after is BatchNo/Qty/Free/Rate/Value/
  // [Prod.Dis]. This also sidesteps a right-to-left popping ambiguity: BatchNo is sometimes plain
  // digits (e.g. "032683"), which -- when that row's Free also happened to be blank/zero (blank,
  // not printed as "0", same as every other omitted-zero cell in this report) -- would otherwise
  // be indistinguishable from an integer Qty/Free column by shape alone.
  var mIdx = -1;
  for(var i=1;i<toks.length-2;i++){
    if(/^\d+$/.test(toks[i+1]) && /^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(toks[i+2])){ mIdx = i; break; }
  }
  if(mIdx <= 0) return null;
  var head = toks.slice(0, mIdx); // ProductCode ProductName Pack
  var date = parseProductReportDate(toks[mIdx+2]);
  var afterDate = toks.slice(mIdx+3); // BatchNo(+ rare stray punctuation continuation) Qty [Free] Rate Value [Prod.Dis]
  if(!afterDate.length) return null;
  var restStart = 1; // afterDate[0] is always BatchNo; absorb a lone "." or "-" glued-looking continuation of it, if present
  while(restStart < afterDate.length && /^[.\-']+$/.test(afterDate[restStart])) restStart++;
  var rest = afterDate.slice(restStart);
  var decimals = [];
  while(decimals.length < 3 && rest.length && /^-?[\d,]+\.\d+$/.test(rest[rest.length-1])){
    decimals.unshift(parseFloat(rest.pop().replace(/,/g,'')));
  }
  if(decimals.length < 2) return null; // need at least Rate + Value -- not a data row
  var value = decimals[1]; // decimals[0]=Rate (unused), decimals[2] if present=Prod.Dis (unused)
  if(rest.length<1 || rest.length>2 || !rest.every(function(t){ return /^\d+$/.test(t); })) return null;
  var qty = parseInt(rest[0],10), free = rest.length===2 ? parseInt(rest[1],10) : 0;
  if(!head.length) return null;
  if(/^\d+$/.test(head[0])) head.shift(); // leading product code -- not shown to Kapil
  var name = head.join(' ').trim();
  if(!name) return null;
  return {name:name, date:date, qty:qty, free:free, value:value};
}
function parseProductWiseSalesPdf(file){
  return extractPdfLines(file).then(function(lines){
    var fromDate=null, toDate=null;
    lines.forEach(function(line){
      if(fromDate!=null) return;
      var fm = /From\s*:\s*(\d{1,2}\/\d{1,2}\/\d{2,4})\s*To\s*:\s*(\d{1,2}\/\d{1,2}\/\d{2,4})/.exec(line);
      if(fm){ fromDate = parseProductReportDate(fm[1]); toDate = parseProductReportDate(fm[2]); }
    });
    var customers=[], cur=null, skipped=0, printedGrandTotal=null, inSummary=false;
    lines.forEach(function(rawLine){
      var line = rawLine.trim();
      if(!line) return;
      var gm = /^Total\s*Value\s*:\s*([\d,]+\.\d+)/i.exec(line);
      if(gm){ printedGrandTotal = parseFloat(gm[1].replace(/,/g,'')); inSummary = true; cur = null; return; }
      if(inSummary) return; // "Customer-wise Purchase Total Summary" tail (Sanjivan only) -- amount-only, already covered by the Party Sales tab's own report
      var cm = /^Customer:\s*\[([^\]]+)\]\s*(.*)$/.exec(line);
      if(cm){
        var label = cm[2].replace(/\[PH[.\s][^\]]*\]/gi,' ').replace(/\s+/g,' ').replace(/,\s*$/,'').trim();
        cur = {code:cm[1], rawLabel:label, items:[], printedTotal:null};
        customers.push(cur);
        return;
      }
      if(!cur) return; // header/footer lines before the first customer
      var tm = /^Total\s*:?\s*([\d,]+\.\d+)/.exec(line);
      if(tm){ cur.printedTotal = parseFloat(tm[1].replace(/,/g,'')); return; }
      if(/^[=\-\s.]+$/.test(line)) return;
      var row = parseProductWiseSalesLine(line);
      if(row) cur.items.push(row); else skipped++;
    });
    // Aggregate per customer, per product name -- the same product can appear on several lines
    // (separate invoices/batches/dates), not pre-aggregated in the PDF.
    var totalValue=0, totalMismatches=0;
    customers.forEach(function(c){
      var byName = {};
      c.items.forEach(function(it){
        var g = byName[it.name];
        if(!g){ g = {n:it.name, q:0, f:0, o:0, d:it.date, v:0, s:isLikelyScheme(it.name)}; byName[it.name]=g; }
        g.q += it.qty; g.f += it.free; g.o += 1; g.v += it.value;
        if(it.date && (!g.d || it.date > g.d)) g.d = it.date;
      });
      c.products = Object.keys(byName).map(function(k){ return byName[k]; }).sort(function(a,b){ return b.o-a.o || b.q-a.q; });
      var computedTotal = 0; c.products.forEach(function(p){ computedTotal += p.v; });
      if(c.printedTotal!=null && Math.abs(computedTotal-c.printedTotal) >= 1) totalMismatches++;
      totalValue += computedTotal;
      delete c.items;
    });
    return {customers:customers, fromDate:fromDate, toDate:toDate, totalValue:totalValue, printedGrandTotal:printedGrandTotal, skippedLines:skipped, customerTotalMismatches:totalMismatches};
  });
}

/* ============================== ORDER LIST PDF EXPORT ==============================
   Company Order List can be sent to the company as a real PDF (not just .txt) — lazy-loads
   jsPDF (cdnjs, pinned 2.5.1) only when the "Download PDF" button is used. Letterhead-style
   header (stockist name big, company as "To:"), then a #/Product Name/Pack/Order Qty table
   with a solid dark-navy header band and alternating row tint (no grid lines) -- Pack is
   split out of the merged "product" string via splitProductPack so it shows next to the
   quantity, matching the app's own table styling. Ends with an optional Note and a closing
   "Thank you for your support." line. */
var JSPDF_CDN_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
var _jsPdfLoadPromise = null;
function loadJsPdf(){
  if(_jsPdfLoadPromise) return _jsPdfLoadPromise;
  _jsPdfLoadPromise = new Promise(function(resolve, reject){
    if(window.jspdf && window.jspdf.jsPDF){ resolve(window.jspdf.jsPDF); return; }
    var s = document.createElement('script');
    s.src = JSPDF_CDN_URL;
    s.onload = function(){
      if(window.jspdf && window.jspdf.jsPDF) resolve(window.jspdf.jsPDF);
      else reject(new Error('PDF library loaded but isn\'t working.'));
    };
    s.onerror = function(){ reject(new Error('PDF library failed to load — please check your internet.')); };
    document.head.appendChild(s);
  });
  return _jsPdfLoadPromise;
}
function formatGeneratedTimestamp(d){
  var day = d.getDate(), month = d.getMonth()+1, year = d.getFullYear();
  var h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
  var ampm = h>=12 ? 'pm' : 'am';
  var h12 = h%12; if(h12===0) h12 = 12;
  return day+'/'+month+'/'+year+', '+h12+':'+pad2(m)+':'+pad2(s)+' '+ampm;
}
/* opts: {companyName, generatedAt: Date, groups:[{stockistName, items:[{product,qty}]}], note}
   The order flows FROM the stockist TO the company (Kapil sends this list to Smartway on the
   stockist's behalf), so when there's exactly one stockist group (the normal case -- Order
   Recommendation always downloads one stockist at a time), the stockist's own name+city is
   the big letterhead-style title up top, like the sender's letterhead on a real order form,
   with the company shown smaller as "To: ...". With zero or multiple groups (no single sender
   to name) it falls back to the old company-name-as-title layout. */
function buildOrderListPdfBlob(opts){
  var companyName = (opts.companyName || 'Smartway Wellness Pvt. Ltd.').toUpperCase();
  var generatedStr = formatGeneratedTimestamp(opts.generatedAt || new Date());
  var groups = opts.groups || [];
  var note = (opts.note || '').trim();
  var senderName = (groups.length===1 && groups[0].stockistName) ? String(groups[0].stockistName).toUpperCase() : null;

  return loadJsPdf().then(function(JsPDF){
    var doc = new JsPDF({unit:'pt', format:'a4'});
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var marginX = 42, marginTop = 50, marginBottom = 50;
    var tableW = pageW - marginX*2;
    // # | Product Name | Pack | Order Qty -- Pack is split out of the merged "product" string
    // (see splitProductPack) so it reads next to the quantity, as a plain table with a solid
    // header band and alternating row tint (no grid lines) -- matches the card-style tables
    // used elsewhere in the app instead of the old boxed/bordered spreadsheet look.
    var HEADER_FILL = [22,54,93], STRIPE_FILL = [246,249,251], TEXT_DARK = [20,26,35];
    var colNumW = 26, colPackW = 66, colQtyW = 80, colProdW = tableW - colNumW - colPackW - colQtyW;
    var xNum = marginX, xProd = marginX+colNumW, xPack = xProd+colProdW, xQty = xPack+colPackW;
    var rowH = 22;
    var y = marginTop;

    function drawTitle(){
      doc.setFont('helvetica','bold'); doc.setFontSize(18);
      doc.setTextColor(0,0,0);
      doc.text(senderName || companyName, pageW/2, y, {align:'center'});
      y += 20;
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      doc.setTextColor(90,90,90);
      if(senderName){ doc.text('To: '+companyName, pageW/2, y, {align:'center'}); y += 14; }
      doc.text('ORDER LIST - Generated: '+generatedStr, pageW/2, y, {align:'center'});
      doc.setTextColor(0,0,0);
      y += 22;
    }
    function drawColHeader(){
      doc.setFillColor(HEADER_FILL[0], HEADER_FILL[1], HEADER_FILL[2]);
      doc.rect(marginX, y, tableW, rowH, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
      doc.setTextColor(255,255,255);
      doc.text('#', xNum+colNumW/2, y+rowH-7, {align:'center'});
      doc.text('PRODUCT NAME', xProd+6, y+rowH-7);
      doc.text('PACK', xPack+6, y+rowH-7);
      doc.text('ORDER QTY', xQty+colQtyW-6, y+rowH-7, {align:'right'});
      doc.setTextColor(0,0,0);
      y += rowH;
    }
    function drawGroupHeader(name){
      doc.setFillColor(HEADER_FILL[0], HEADER_FILL[1], HEADER_FILL[2]);
      doc.rect(marginX, y, tableW, rowH, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
      doc.setTextColor(255,255,255);
      doc.text(name, xProd+6, y+rowH-7);
      doc.setTextColor(0,0,0);
      y += rowH;
    }
    function ensureSpace(needed, onNewPage){
      if(y + needed > pageH - marginBottom){
        doc.addPage();
        y = marginTop;
        onNewPage();
      }
    }

    drawTitle();
    ensureSpace(rowH, function(){ drawTitle(); });
    drawColHeader();

    var rowNum = 0;
    groups.forEach(function(g){
      if(!g.items.length) return;
      ensureSpace(rowH, function(){ drawColHeader(); });
      if(!senderName) drawGroupHeader(g.stockistName); // already named as the letterhead title -- no need to repeat it as a row
      g.items.forEach(function(it){
        ensureSpace(rowH, function(){ drawColHeader(); });
        rowNum++;
        if(rowNum % 2 === 0){
          doc.setFillColor(STRIPE_FILL[0], STRIPE_FILL[1], STRIPE_FILL[2]);
          doc.rect(marginX, y, tableW, rowH, 'F');
        }
        var split = splitProductPack(it.product);
        var name = split.name;
        var maxChars = 46;
        if(name.length > maxChars) name = name.slice(0, maxChars-3) + '...';
        doc.setTextColor(TEXT_DARK[0], TEXT_DARK[1], TEXT_DARK[2]);
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
        doc.text(String(rowNum), xNum+colNumW/2, y+rowH-7, {align:'center'});
        doc.text(name, xProd+6, y+rowH-7);
        doc.text(split.pack, xPack+6, y+rowH-7);
        doc.setFont('helvetica','bold');
        doc.text(String(it.qty), xQty+colQtyW-6, y+rowH-7, {align:'right'});
        doc.setTextColor(0,0,0);
        y += rowH;
      });
    });

    y += 10;
    if(note){
      ensureSpace(30, function(){ drawColHeader(); });
      doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.text('Note:', marginX, y);
      y += 14;
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
      var noteLines = doc.splitTextToSize(note, tableW);
      noteLines.forEach(function(ln){
        ensureSpace(14, function(){});
        doc.text(ln, marginX, y);
        y += 13;
      });
      y += 8;
    }

    ensureSpace(20, function(){});
    doc.setFont('helvetica','italic'); doc.setFontSize(10);
    doc.text('Thank you for your support.', pageW/2, y, {align:'center'});

    return doc.output('blob');
  });
}
